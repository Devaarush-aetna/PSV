identity:
  source_id: SC_SCLLR_LPCMFT
  board_name: "SC Dept. of Labor, Licensing and Regulation — Telehealth LPC/MFT Registry"
  state: SC
  country: US
  profession_codes: [LPC, MFT, LPCA, LMFTA]
  # SC LLR Telehealth out-of-state provider registry for Licensed Professional Counselors
  # and Marriage & Family Therapists (llr.sc.gov/TeleHealth/Counselor.html).
  # Full roster loaded at page-time; jQuery DataTables global search filters rows client-side.
  # Table id="otherStatesLicensesList"; thead uses <td> (not <th>).
  # Columns (probe 2026-06-17): 0=SC Reg #, 1=Name, 2=City, 3=State Code,
  #   4=Other Licensed State 1, 5=Other State 1 License Type, 6=Other State 1 License Number,
  #   7=Other Licensed State 2, 8=Other State 2 License Type, 9=Other State 2 License Number.
  # SC Reg # format: "TLC NNN PC" (Telehealth Licensed Counselor + sequence + profession code).
  base_url: "https://llr.sc.gov/TeleHealth/Counselor.html"
  archetype: datatables_jsapi

datatables:
  table_selector: "#otherStatesLicensesList"
  # col 1 = Name for name searches; -1 = global for license_number (home-state lic or SC Reg #)
  column_index:
    last_name: 1
    first_name: 1
    license_number: -1
  settle_ms: 1500

search:
  modes:
    - mode: last_name
    - mode: first_name
    - mode: license_number
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[type='search'][aria-controls='otherStatesLicensesList']"
    search_button:
      selector: ""
  results_wait:
    strategy: element_visible
    selector: "#otherStatesLicensesList tbody tr"
    timeout_ms: 20000
    no_results_indicators:
      - "No matching records found"
      - "No data available in table"
      - "no matching records"

results:
  type: table
  table:
    row_selector: "#otherStatesLicensesList tbody tr"
    cell_selector: "td"
    skip_first_row: false
    columns:
      0: license_number
      1: full_name
      2: address
      5: license_type
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map: {}
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1440
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/SC_SCLLR_LPCMFT/{run_id}/"

compliance:
  tos_review_date: "2026-06-17"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
    # First result (probe 2026-06-17): [TLC 491 MFT] MICKENS-SMITH, KENYAH MONET (+9 more)
