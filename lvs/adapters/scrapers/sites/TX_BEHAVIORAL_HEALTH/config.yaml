identity:
  source_id: TX_BEHAVIORAL_HEALTH
  board_name: Texas Department of Licensing and Regulation - Behavior Analysts
  state: TX
  country: US
  profession_codes: [ABA]
  # TDLR Behavior Analysts — Salesforce/Vlocity OmniStudio SPA.
  # Results rendered in nested native shadow DOM; Playwright >> combinator
  # required for row and cell selectors to pierce shadow roots.
  # Smoke test: license_number "5091" (Tidwell). Record count 0 unresolved —
  # pending live re-test to confirm selectors are correct.
  base_url: "https://www.tdlr.texas.gov/MOOS/License/ViewLicenseInformation"
  archetype: angular_spa

search:
  modes:
    - mode: license_number
      input_selector: "input[name='licenseNumber'], input[placeholder*='License']"
    - mode: last_name
      input_selector: "input[name='lastName'], input[placeholder*='Last Name']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[name='licenseNumber']"
      fallback_selectors:
        - "input[placeholder*='License']"
        - "input[type='text']:visible"
    search_button:
      selector: "button:has-text('Search'), input[type='submit'][value*='Search']"
  results_wait:
    strategy: element_visible
    selector: "c-omnistudio-list >> tr, .slds-table >> tr, table tr.result-row"
    timeout_ms: 30000
    no_results_indicators:
      - "no records found"
      - "no results found"
      - "0 results"
      - "no licenses matching"

results:
  type: table
  table:
    # Vlocity OmniStudio SPA — results in nested shadow DOM.
    # Use Playwright >> combinator to pierce shadow roots.
    row_selector: "c-omnistudio-list >> tbody tr, .slds-table >> tbody tr"
    cell_selector: "td"
    columns:
      0: license_number
      1: full_name
      2: license_type
      3: status
      4: expiration_date
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: element_visible
    selector: "label, .slds-form-element__label"
    timeout_ms: 20000
  strategies:
    - type: label_sibling
    - type: dt_dd
    - type: two_column_table
  field_map:
    "License Number": license_number
    "License #": license_number
    "Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "License Type": license_type
    "License Status": status
    "Status": status
    "Expiration Date": expiration_date
    "Issue Date": issue_date
    "Original Issue Date": issue_date
    "City": city
    "State": state_code
    "County": county

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Cancelled": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [2000, 4000, 8000]
    retry_on: ["timeout", "navigation_error", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "Evidence/TX_BEHAVIORAL_HEALTH/{run_id}/"

compliance:
  tos_review_date: "2026-08-12"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: license_number
  query: "5091"
  expect:
    min_records: 1
    full_name_contains: "Tidwell"
  skip: true
  skip_reason: "record_count_0_unresolved: selectors need live re-test against OmniStudio shadow DOM"
