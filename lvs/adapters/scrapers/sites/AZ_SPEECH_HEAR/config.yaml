identity:
  source_id: "AZ_SPEECH_HEAR"
  board_name: "Arizona Department of Health Services - Licensing Services (Speech-Language Pathology, Audiology, Hearing Aid Dispensing)"
  state: "AZ"
  country: "US"
  profession_codes: ["SLP", "AUD", "HAD"]
  base_url: "https://hsapps.azdhs.gov/ls/sod/SearchProv.aspx?type=AUD"
  archetype: classic_html_form

# ADHS Provider Search has a DropDownListPvType with 9 type codes (no working "ALL"
# option). Iterate all of them and merge results into one set.
multi_iteration:
  field_selector: "select#ctl00_ContentPlaceHolder1_DropDownListPvType"
  field_kind: select
  values:
    - "261"  # AUDIOLOGISTS
    - "271"  # DISPENSING AUDIOLOGISTS
    - "251"  # HEARING AID DISPENSERS
    - "2B1"  # SLP ASSISTANTS
    - "232"  # SPEECH LANGUAGE PATHOLOGY
    - "281"  # SLP LIMITED
    - "2A1"  # TEMP HEARING AID DISPENSER
    - "2C1"  # TEMP SPEECH LANGUAGE PATHOLOGY
    - "231"  # TELEHEALTH

search:
  modes:
    - mode: license_number
      input_selector: "#ctl00_ContentPlaceHolder1_TextBoxPvName"
      button_selector: "#ctl00_ContentPlaceHolder1_btnSubmit1"
    - mode: last_name
      input_selector: "#ctl00_ContentPlaceHolder1_TextBoxPvName"
      button_selector: "#ctl00_ContentPlaceHolder1_btnSubmit1"
    - mode: first_name
      input_selector: "#ctl00_ContentPlaceHolder1_TextBoxPvName"
      button_selector: "#ctl00_ContentPlaceHolder1_btnSubmit1"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#ctl00_ContentPlaceHolder1_TextBoxPvName"
    search_button:
      selector: "#ctl00_ContentPlaceHolder1_btnSubmit1"
  results_wait:
    strategy: network_idle
    selector: "#ctl00_ContentPlaceHolder1_DgFacils tr"
    timeout_ms: 20000
    no_results_indicators:
      - "no records found"
      - "no matches"

results:
  type: table
  table:
    row_selector: "#ctl00_ContentPlaceHolder1_DgFacils tr"
    cell_selector: "td"
    skip_first_row: true
    columns:
      1: full_name
      2: address
      3: city
      4: license_type
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map: {}

output:
  status_map:
    "ACTIVE": active
    "Active": active
    "INACTIVE": inactive
    "EXPIRED": expired
    "SUSPENDED": suspended
    "REVOKED": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/AZ_SPEECH_HEAR/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
