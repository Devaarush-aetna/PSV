identity:
  source_id: KS_KSBHADA
  board_name: Kansas State Board of Healing Arts
  state: KS
  country: US
  profession_codes: []
  base_url: "https://www.kansas.gov/ssrv-ksbhada/search.html"
  archetype: classic_html_form

search:
  modes:
    # Selectors use fuzzy match — same approach as original scraper (selectors unconfirmed)
    - mode: license_number
      input_selector: "input[id*='icense'], input[name*='icense'], input[id*='licNo'], input[name*='licNo']"
    - mode: last_name
      input_selector: "input[id*='ast'], input[name*='ast']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[id*='icense'], input[name*='icense']"
    search_button:
      selector: "button[type='submit'], input[type='submit'], input[value='Search']"
  results_wait:
    strategy: network_idle
    timeout_ms: 20000
    no_results_indicators:
      - "no results"
      - "total matches found: 0"
      - "no records"
      - "not found"

results:
  type: table
  table:
    row_selector: "table tbody tr, table tr"
    cell_selector: "td"
    # Columns: Name | License Type | License Number | City, State | Status
    columns:
      0: "full_name"
      1: "license_type"
      2: "license_number"
      3: "city"
      4: "status"
  has_detail_page: true
  detail_trigger:
    type: link_in_cell
    selector: "a[href*='details.html']"
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: url_change
    timeout_ms: 15000
  strategies:
    - type: strong_label
    - type: dt_dd
    - type: two_column_table
    - type: four_column_table
    - type: label_sibling
  field_map:
    "License Number": license_number
    "License No": license_number
    "Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "License Type": license_type
    "Type": license_type
    "License Status": status
    "Status": status
    "License Expiration Date": expiration_date
    "Expiration Date": expiration_date
    "Expire Date": expiration_date
    "Original License Date": issue_date
    "Issue Date": issue_date
    "Last Renewal Date": last_renewal_date
    "Profession": license_type
    "Address": address
    "City": city
    "State": state_code
    "Zip": zip_code
  back_navigation:
    strategy: browser_back
    wait_after_ms: 1000

output:
  status_map:
    "Active": active
    "active": active
    "Current": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
    "Previous": inactive
    "previous": inactive
    "Cancelled": inactive
    "cancelled": inactive
    "Probation": probation
    "probation": probation
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "navigation_error", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "./evidence/{source_id}/{run_id}/"

compliance:
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Burroughs"
  expect:
    min_records: 1
    full_name_contains: "Burroughs"
