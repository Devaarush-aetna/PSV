identity:
  source_id: ND_PT
  board_name: North Dakota Board of Physical Therapy
  state: ND
  country: US
  profession_codes: [PT, PTA]
  # Classic HTML form at ndbpt.org/verify/.
  # From northdacota_PT_web.py: same structure as ND_DENTISTRY.
  # Form has "Last Name", "First Name", "License Number", "City" labels.
  # Results: table with headers including Name/License; wait for "table tr".
  base_url: "https://www.ndbpt.org/verify/"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#inputLicenseNo"
    - mode: last_name
      input_selector: "#inputLastName"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#inputLastName"
    search_button:
      selector: "button[type='submit'][title*='Search']"
  results_wait:
    strategy: element_visible
    selector: "table.table tbody tr"
    timeout_ms: 20000
    no_results_indicators:
      - "no results"
      - "no records"
      - "not found"
      - "no match"
      - "0 results"

results:
  type: table
  table:
    row_selector: "table.table tbody tr"
    cell_selector: "td"
    skip_first_row: false
    columns:
      0: "full_name"
      1: "license_number"
      2: "expiration_date"
      3: "status"
      5: "city"
      6: "license_type"
  has_detail_page: false
  pagination:
    enabled: true
    strategy: next_button
    next_selector: "a[rel='next'], a:has-text('Next'), a:has-text('>')"

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Current": active
    "current": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
    "Cancelled": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "navigation_error", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/ND_PT/{run_id}/"

compliance:
  tos_review_date: "2026-06-12"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
