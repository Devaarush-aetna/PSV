identity:
  source_id: MO_RESPIRATORY
  board_name: Missouri State Advisory Commission for Respiratory Care
  state: MO
  country: US
  profession_codes: [RT, RP, RCP]
  # Missouri Division of Professional Registration — Salesforce LWC portal.
  # Downloads a ZIP for the "Respiratory Care" board; ZIP contains a
  # tab-delimited TXT with all RT/RP/RCP licensee records.
  base_url: "https://mopro.mo.gov/license/s/license-downloads"
  archetype: csv_bulk

csv_bulk:
  download_strategy: mopro_zip
  board_label: "Respiratory Care"
  cache_days: 7
  cache_dir: "./PSV/CSVS/mo_respiratory"
  encoding: "latin-1"
  file_format: txt
  separator: "\t"
  search_columns:
    license_number: "lic_number"
    last_name: "prc_last_name"
    first_name: "prc_first_name"
    full_name: "prc_last_name"

search:
  modes:
    - mode: license_number
    - mode: last_name
    - mode: first_name
    - mode: first_and_last
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: ""
    search_button:
      selector: ""
  results_wait:
    strategy: delay
    timeout_ms: 500
    no_results_indicators: []

results:
  type: table
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map:
    "lic_number": license_number
    "prc_first_name": first_name
    "prc_last_name": last_name
    "prc_middle_name": middle_name
    "prc_suffix": suffix
    "lst_description": status
    "lic_exp_date": expiration_date
    "lic_orig_issue_date": issue_date
    "lic_profession": license_type
    "ba_address": address
    "ba_city": city
    "ba_state": state_code
    "ba_zip": zip_code
    "discipline": disciplinary_actions

output:
  status_map:
    "Active": active
    "ACTIVE": active
    "active": active
    "Inactive": inactive
    "INACTIVE": inactive
    "inactive": inactive
    "Expired": expired
    "EXPIRED": expired
    "expired": expired
    "Lapsed": expired
    "Suspended": suspended
    "SUSPENDED": suspended
    "Revoked": revoked
    "REVOKED": revoked
    "Cancelled": inactive
    "Non-renewed": expired
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 120000
  navigation_timeout_ms: 90000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [5000, 10000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: false
  capture_screenshot: false
  capture_on: ["error"]
  storage: local
  local_path: "Evidence/MO_RESPIRATORY/{run_id}/"

compliance:
  tos_review_date: "2026-08-12"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
