identity:
  source_id: WY_PODIATRY
  board_name: Wyoming Board of Registration in Podiatry
  state: WY
  country: US
  profession_codes: [DPM]
  # Wyoming Google Sheets public roster — 7-day cache.
  # Link selector opens Google Sheet; export as CSV.
  # CSV has 3 description rows before header (header_row: 3).
  # Active sheet (header_row 6): Licensee Name, Status, License #, Issued, Expires
  # Mailing List sheet (Active + Deactivated) — different header format with separate name columns
  base_url: "https://podiatry.wyo.gov/public/license-verification"
  archetype: csv_bulk

csv_bulk:
  download_strategy: google_sheet_link
  link_selector: "text=Mailing List of Active and Expired Licenses"
  header_row: 6
  cache_days: 7
  cache_dir: "./PSV/CSVS"
  encoding: "utf-8-sig"
  search_columns:
    license_number: "License #"
    last_name: "Last Name"

search:
  modes:
    - mode: license_number
    - mode: last_name
    - mode: first_name
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: ""
    search_button:
      selector: ""
  results_wait:
    strategy: network_idle
    timeout_ms: 30000
    no_results_indicators: []

results:
  type: table
  table:
    row_selector: ""
    cell_selector: ""
    columns: {}
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map:
    # Mailing List sheet (Active + Deactivated) — separate name columns expected
    "Last Name": last_name
    "First Name": first_name
    "License Number": license_number
    "License No": license_number
    "Issue Date": issue_date
    "Expiration Date": expiration_date
    "License Status": status
    "Status": status
    # Fallback: Active-only sheet used full-name and short column names
    "Licensee Name": last_name
    "License #": license_number
    "Issued": issue_date
    "Expires": expiration_date

output:
  status_map:
    "A": active
    "Active": active
    "active": active
    "Deactivated": inactive
    "deactivated": inactive
    "I": inactive
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

  proxy:
    enabled: true
evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "Evidence/WY_PODIATRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-10"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
