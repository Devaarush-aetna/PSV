identity:
  source_id: "OH_PROVIDERS_INDIVIDUAL"
  board_name: "State of Ohio Licensure - Individual"
  state: "OH"
  country: "US"
  profession_codes: ["IND"]   # umbrella individual-licensure roster across many professions
  # Standalone scraper: Ohio_All_Providers(Individual)_CSV.py
  # Same flow as OH_PROVIDERS_BUSINESS but the URL targets the individual
  # licensure dataset (state-of-ohio-licensure rather than -businesses).
  base_url: "https://data.ohio.gov/wps/portal/gov/data/view/state-of-ohio-licensure"
  archetype: csv_bulk

csv_bulk:
  download_strategy: ohio_data_portal_csv
  cache_days: 7
  cache_dir: "./PSV/CSVS"
  encoding: "utf-8-sig"
  download_timeout_ms: 300000
  # Column names depend on the live export — adjust after first successful run.
  # CSV columns (from live download 2026-06-16): LICENSEE_NAME (combined "LAST,
  # FIRST MIDDLE"), BOARD, LICENSE_NUMBER, TYPE, STATUS, SUB_STATUS,
  # SUB_CATEGORY, BOARD_ACTION, PARCEL_CITY, PARCEL_STATE, PARCEL_COUNTY,
  # PARCEL_ZIP_CODE, PARCEL_COUNTRY, COMPACT_ELIGIBILITY, ISSUE_DATE,
  # EFFECTIVE_DATE, EXPIRATION_DATE, plus 7 ENDORSEMENT_* groups, 10 MED_*
  # specialty groups, and 5 NATIONAL_CERTIFICATION_* groups. LICENSEE_NAME is
  # the only person-name column; substring search on it matches either last
  # or first name.
  # parse_combined_name_column: splits "LAST , FIRST MIDDLE" into _parsed_last,
  # _parsed_first, _parsed_middle so last-name searches are precise and
  # first-name searches also match middle-name-as-preferred-name cases.
  parse_combined_name_column: "LICENSEE_NAME"
  search_columns:
    # LICENSE_NUMBER holds the base license (e.g. RN.364874); APRN / endorsement
    # designations (e.g. APRN.CNP.0026867) live in ENDORSEMENT_NUMBER_1..7.
    # Listing all 8 as a list triggers OR-search across all columns so either
    # the base license number or any endorsement number finds the record.
    license_number:
      - "LICENSE_NUMBER"
      - "ENDORSEMENT_NUMBER_1"
      - "ENDORSEMENT_NUMBER_2"
      - "ENDORSEMENT_NUMBER_3"
      - "ENDORSEMENT_NUMBER_4"
      - "ENDORSEMENT_NUMBER_5"
      - "ENDORSEMENT_NUMBER_6"
      - "ENDORSEMENT_NUMBER_7"
    last_name: "_parsed_last"
    first_name: "LICENSEE_NAME"
  # AND-filter columns: applied when the corresponding SearchQuery field is set
  license_type_column: "TYPE"      # e.g. "License", "Certificate", "Registration"
  provider_type_column: "BOARD"    # e.g. "State Medical Board", "State Board of Nursing"

search:
  modes:
    - mode: license_number
    - mode: last_name
    - mode: first_name
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: ""
    search_button:
      selector: ""
  results_wait:
    strategy: delay
    timeout_ms: 1000
    no_results_indicators: []

results:
  type: table
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "LICENSE_NUMBER": license_number
    "LICENSEE_NAME": full_name
    "BOARD": board
    "TYPE": license_type
    "STATUS": status
    "SUB_STATUS": sub_status
    "SUB_CATEGORY": sub_category
    "ISSUE_DATE": issue_date
    "EFFECTIVE_DATE": effective_date
    "EXPIRATION_DATE": expiration_date
    "PARCEL_CITY": city
    "PARCEL_STATE": state_code
    "PARCEL_ZIP_CODE": zip_code
    "COMPACT_ELIGIBILITY": compact_eligibility

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1920
    height: 1080
  timeout_ms: 360000
  navigation_timeout_ms: 300000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [3000, 8000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/OH_PROVIDERS_INDIVIDUAL/{run_id}/"

compliance:
  tos_review_date: "2026-06-16"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
  # 2026-06-16 (session 29): newly added board — config built from
  # Ohio_All_Providers(Individual)_CSV.py. Same engine strategy as
  # OH_PROVIDERS_BUSINESS (ohio_data_portal_csv); see that config's notes for
  # known caveats around headless detection.
