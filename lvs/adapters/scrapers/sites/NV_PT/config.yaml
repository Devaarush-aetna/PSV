identity:
  source_id: "NV_PT"
  board_name: "Nevada Physical Therapy Board"
  state: "NV"
  country: "US"
  profession_codes: ["PT", "PTA"]
  base_url: "https://nptb.portalus.thentiacloud.net/webs/portal/register/#/"
  archetype: "thentia_cloud"

search:
  modes:
    - mode: "license_number"
      dropdown_value: "License Number"
    - mode: "last_name"
      dropdown_value: "Last Name"
    - mode: "first_name"
      dropdown_value: "First Name"
  form:
    search_by_dropdown:
      strategy: "none"
      selector: ""
    search_input:
      selector: "input[id='keywords']"
      fallback_selectors:
        - "input[placeholder*='Search']"
        - "input[type='text']"
    search_button:
      selector: "button.btn-brand"
      fallback_selectors:
        - "[aria-label='Search']"
        - "button[type='submit']"
  results_wait:
    strategy: "element_visible"
    selector: "table tbody tr"
    timeout_ms: 30000
    no_results_indicators:
      - "no results"
      - "no records found"
      - "0 result"

results:
  type: "table"
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    columns:
      0: "name"
      1: "license_number"
      2: "license_type"
      3: "status"
  has_detail_page: true
  detail_trigger:
    type: "view_button"
    selector: "a.btn-single"
  pagination:
    enabled: true
    strategy: "next_button"
    next_selector: "a[title='Next Page'], a.next, [aria-label='Next']"
    disabled_class: "disabled"

detail:
  wait:
    strategy: "url_change"
    timeout_ms: 15000
    fallback_selectors:
      - "div[class*='profile']"
      - "dl"
      - "dt"
  strategies:
    - type: "dt_dd"
    - type: "label_sibling"
    - type: "field_label_value"
    - type: "two_column_table"
    - type: "four_column_table"
  field_map:
    "License Number": "license_number"
    "License No": "license_number"
    "First Name": "first_name"
    "Last Name": "last_name"
    "Name": "full_name"
    "License Type": "license_type"
    "License Status": "status"
    "Status": "status"
    "Issue Date": "issue_date"
    "Effective Date": "effective_date"
    "Expiration Date": "expiration_date"
    "Exp Date": "expiration_date"
    "License Expiration Date": "expiration_date"
    "Address": "address"
    "Street Address": "address"
    "Street": "address"
    "Public Address": "address"
    "City": "city"
    "Public City": "city"
    "State": "state_code"
    "Province/State": "state_code"
    "Public State": "state_code"
    "Zip": "zip_code"
    "Zip Code": "zip_code"
    "Postal Code": "zip_code"
    "Public ZIP Code": "zip_code"
    "Initial License Date": "issue_date"
    "Original Date of Licensure": "issue_date"
  sections:
    - name: "Board Actions"
      type: "header_mapped_table"
      field: "disciplinary_actions"
    - name: "Place of Practice"
      type: "header_mapped_table"
      field: "practice_locations"
    - name: "Authorizations"
      type: "header_mapped_table"
      field: "authorizations"
    - name: "Specialties"
      type: "header_mapped_table"
      field: "specialties"
    - name: "Education History"
      type: "header_mapped_table"
      field: "education_history"
    - name: "Postgraduate Training"
      type: "header_mapped_table"
      field: "postgrad_training"
  back_navigation:
    strategy: "browser_back"
    wait_after_ms: 1500

output:
  license_record:
    license_number: "{license_number}"
    licensee_first_name: "{first_name}"
    licensee_last_name: "{last_name}"
    licensee_full_name: "{full_name}"
    license_type: "{license_type}"
    status: "{status}"
    effective_date: "{effective_date}"
    issue_date: "{issue_date}"
    expiration_date: "{expiration_date}"
    address: "{address}"
    city: "{city}"
    state_code: "{state_code}"
  status_map:
    "active": "active"
    "current": "active"
    "inactive": "inactive"
    "expired": "expired"
    "suspended": "suspended"
    "revoked": "revoked"
    "probation": "probation"
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"
    - "%b-%d-%Y"
    - "%B-%d-%Y"

transport:
  browser: "chromium"
  headless: true
  viewport:
    width: 1920
    height: 1080
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "navigation_error", "network_error"]
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: "local"
  local_path: "./evidence/NV_PT/{run_id}/"

compliance:
  tos_review_date: "2026-05-15"
  tos_review_ticket: "LVS-104"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: license_number
  query: "3485"
  expect:
    license_number: "3485"
    status: "active"
    full_name_contains: "Distad"
  skip: true
  skip_reason: "network_blocked: portalus.thentiacloud.net unreachable on corporate network (Zscaler)"
