identity:
  source_id: "NY_CREDENTIALS"
  board_name: "New York State Education Department - Office of the Professions (Multi-Profession)"
  state: "NY"
  country: "US"
  base_url: "https://eservices.nysed.gov/professions/verification-search"
  archetype: ny_credentials
  # 2026-08-18: Replaced the Vue-SPA browser automation (classic_html_form) with a direct
  # call to the JSON API the SPA itself uses. The page (eservices.nysed.gov) is a thin Vue
  # client over https://api.nysed.gov/rosa/V2/*. Driving the form was ~70% reliable and
  # Zscaler-fragile; the API is exact, browserless, and validated at 24/25 on real records.
  #
  # provider_type -> candidate NYSED profession codes, used ONLY by the license-first
  # fallback (when name search finds nothing). The PRIMARY name search uses professionCode=ALL
  # and reads the licensee's real profession code from the result, so this map does not need
  # to be perfect — supersets are fine (the archetype iterates and stops at the first hit).
  profession_code_map:
    ABA: "071,078"
    AP: "025"
    AU: "057"
    CP: "068"
    DC: "070"
    DDS: "050,059,079,081,082,083"
    DMD: "050,059,079,081,082,083"
    DO: "060,061"
    DP: "065"
    DT: "048"
    LC: "018"
    LPC: "018,071,005,006"
    MD: "060,061"
    MT: "027,006"
    MW: "028"
    NP: "029,030,031,032,033,034,035,036,037,038,039,040,041,042,043,044,045,022"
    NPB: "029,030,031,032,033,034,035,036,037,038,039,040,041,042,043,044,045,022"
    NPS: "040,022,018,068"
    NUT: "048"
    OP: "056,055"
    OT: "063,064"
    PAB: "023,024"
    PAS: "023,024"
    PH: "020,021,002,060,061"
    PN: "010,022"
    PT: "062,066"
    RNA: "022,029"
    SH: "057,058"
    ST: "058"
    SW: "072,073,018"
  # The archetype resolves first_name/last_name/license_number internally regardless of the
  # requested mode; declare a broad capability set so the dispatcher never rejects or degrades
  # away usable fields.
  capabilities:
    - first_and_last
    - license_first_last
    - license_and_last
    - license_and_first
    - last_name
    - first_name
    - license_number

# Schema requires a search.modes list. The ny_credentials archetype does NOT read these
# selectors (it calls the JSON API directly) — they exist only to satisfy validation and to
# document the modes the board answers.
search:
  modes:
    - mode: license_number
    - mode: last_name
    - mode: first_name

# NYSED ROSA verification API. The x-oapi-key is a static key embedded in the public
# vsc.js bundle (client-side, not a secret); re-extractable from the bundle if it rotates.
json_api:
  mode: direct
  method: GET
  endpoint_url: "https://api.nysed.gov/rosa/V2"
  headers:
    x-oapi-key: "BRJF4D6U646A5PNMIB77AAW9544QFQKAYAEWI9EPU0TNP72CEEO3L4KGVN5K3R44"
  timeout_ms: 30000

# The archetype builds LicenseRecords directly from the API JSON; results/detail sections
# below are unused by ny_credentials but kept minimal for schema completeness.
results:
  type: table
  has_detail_page: true
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 0
  strategies: []
  field_map: {}

output:
  status_map:
    "Registered": active
    "REGISTERED": active
    "Active": active
    "Not Registered": inactive
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Surrendered": revoked
  # NYSED renders dates as "April 30, 2029".
  date_formats:
    - "%B %d, %Y"
    - "%b %d, %Y"
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 400
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  # api.nysed.gov is a public government API reachable directly. The corporate proxy
  # returns 407 (auth required) and, per prior findings, drops the search endpoints —
  # so this board must NOT route through it.
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: false
  capture_screenshot: false
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NY_CREDENTIALS/{run_id}/"

compliance:
  tos_review_date: "2026-08-18"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: first_and_last
  query: "Kennedy Jane"
  expect:
    min_records: 1
    full_name_contains: "KENNEDY"
  skip: false
