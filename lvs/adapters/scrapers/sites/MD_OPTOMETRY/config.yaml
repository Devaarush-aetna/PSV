identity:
  source_id: MD_OPTOMETRY
  board_name: Maryland Board of Optometry
  state: MD
  country: US
  profession_codes: [OD]
  # ASP.NET WebForms portal at mdbnc.health.maryland.gov — different portal path from ChiroPortal/MassagePortal.
  # License search: #bodyContentPlaceHolder_licenseNoSearch + search2 button.
  # Name search: #bodyContentPlaceHolder_lastNameSearch + search1 button.
  # Results: #bodyContentPlaceHolder_verificationNameGridView (Last Name | First Name | License # | View Details).
  # Detail: #bodyContentPlaceHolder_DetailsView1 two-column label/value table.
  base_url: "https://mdbnc.health.maryland.gov/optverification/default.aspx"
  archetype: classic_html_form

search:
  # Separate input/button IDs for license vs name search (different form controls).
  modes:
    - mode: license_number
      input_selector: "#bodyContentPlaceHolder_licenseNoSearch"
      button_selector: "#bodyContentPlaceHolder_search2"
    - mode: last_name
      input_selector: "#bodyContentPlaceHolder_lastNameSearch"
      button_selector: "#bodyContentPlaceHolder_search1"
    - mode: first_name
      input_selector: "#bodyContentPlaceHolder_lastNameSearch"
      button_selector: "#bodyContentPlaceHolder_search1"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#bodyContentPlaceHolder_lastNameSearch"
    search_button:
      selector: "#bodyContentPlaceHolder_search1"
  results_wait:
    # Both license and name searches produce "View Details" links when records are found.
    strategy: element_visible
    selector: "a:has-text('View Details')"
    timeout_ms: 20000
    no_results_indicators:
      - "no records found"
      - "no match"
      - "not found"
      - "0 records"
      - "did not produce any results"

results:
  type: table
  table:
    # ASP.NET GridView puts the header row inside <tbody> — skip it.
    table_selector: "#bodyContentPlaceHolder_verificationNameGridView"
    table_index: 0
    row_selector: "tbody tr"
    cell_selector: "td"
    skip_first_row: true
    columns:
      0: last_name
      1: first_name
      2: license_number
  has_detail_page: true
  detail_trigger:
    type: link_in_cell
    selector: "a:has-text('View Details')"
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: element_visible
    selector: "#bodyContentPlaceHolder_DetailsView1"
    timeout_ms: 15000
    fallback_selectors:
      - "table#bodyContentPlaceHolder_DetailsView1"
  strategies:
    # DetailsView1 is an ASP.NET DetailsView rendered as a two-column label/value table.
    - type: two_column_table
  field_map:
    # Labels as captured from live detail page HTML (bodyContentPlaceHolder_DetailsView1).
    # Note: "Full Name" (not "Name"), "Original Lic Date", "License Expiration Date".
    "Full Name": full_name
    "License Number": license_number
    "Status": status
    "Original Lic Date": issue_date
    "License Expiration Date": expiration_date
  back_navigation:
    strategy: browser_back
    wait_after_ms: 1500

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "inactive": inactive
    "INACTIVE": inactive
    "Expired": expired
    "expired": expired
    "EXPIRED": expired
    "Non-renewed": expired
    "Non Renewed": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
    "Cancelled": inactive
    "Retired": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "Evidence/MD_OPTOMETRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-08"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
