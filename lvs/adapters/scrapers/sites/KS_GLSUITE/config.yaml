identity:
  source_id: KS_GLSUITE
  board_name: Kansas KDADS Health Occupations Credentialing
  state: KS
  country: US
  profession_codes: []
  base_url: "https://ksdadsv7prod.glsuite.us/glsuiteweb/Clients/ksdads/public/verification/LicVerification.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "input#waCredentialNumber"
    - mode: last_name
      input_selector: "input#waLastName"
    - mode: first_name
      input_selector: "input#waFirstName"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input#waCredentialNumber"
    search_button:
      selector: "input#btnSubmit"
  results_wait:
    strategy: network_idle
    timeout_ms: 20000
    no_results_indicators:
      - "no results"
      - "no records"
      - "not found"

results:
  type: table
  table:
    row_selector: "table tr"
    cell_selector: "td"
    # Columns: 0=Details-link, 1=First, 2=Middle, 3=Last, 4=License#, 5=Profession
    columns:
      1: "first_name"
      2: "licensee_middle_name"
      3: "last_name"
      4: "license_number"
      5: "license_type"
  has_detail_page: true
  detail_trigger:
    type: link_in_cell
    selector: "a[href*='LicenseeDetails']"
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: url_change
    timeout_ms: 15000
  # GLSuite detail page packs all labels+values into 2 <td> cells separated by <br>.
  strategies:
    - type: br_column_table
    - type: two_column_table
    - type: four_column_table
    - type: dt_dd
    - type: label_sibling
  field_map:
    "Name": full_name
    "PROFESSION NAME": license_type
    "City": city
    "State": state_code
    "License/Registration Number": license_number
    "License Number": license_number
    "Credential Number": license_number
    "Issue Date": issue_date
    "Expiration Date": expiration_date
    "Status": status
    "License Status": status
    "Disciplinary Action": disciplinary_action
    "First Name": first_name
    "Last Name": last_name
    "Middle Name": licensee_middle_name
    "Profession": license_type
  back_navigation:
    strategy: browser_back
    wait_after_ms: 1000

output:
  status_map:
    "Active": active
    "active": active
    "Current": active
    "current": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "navigation_error", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "./evidence/{source_id}/{run_id}/"

compliance:
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: license_number
  query: "2720"
  expect:
    min_records: 2
