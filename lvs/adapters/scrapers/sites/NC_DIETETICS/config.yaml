identity:
  source_id: "NC_DIETETICS"
  board_name: "North Carolina Board of Dietetics/Nutrition"
  state: "NC"
  country: "US"
  profession_codes: ["RD", "LDN"]
  base_url: "https://gateway.ncbdn.org/verification/search.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#txtLicenseNumber"
      button_selector: "#btnEnter"
    - mode: last_name
      input_selector: "#txtLastName"
      button_selector: "#btnEnter"
    - mode: first_name
      input_selector: "#txtFirstName"
      button_selector: "#btnEnter"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#txtLastName"
    search_button:
      selector: "#btnEnter"
  results_wait:
    strategy: url_change
    timeout_ms: 25000
    no_results_indicators:
      - "no records found"
      - "no matching"
      - "no licensees"

# Results page renders as <dl class="dl-horizontal"> blocks (no <table>).
# Each licensee = 2 alternating <dl>s in DOM (Name-block + LicNum-block).
# vertical_kv walks <dt> labels and starts a new record at every "Name" label.
results:
  type: table
  table:
    row_selector: "ignored"
    vertical_kv:
      container_selector: "body"
      label_selector: "dl.dl-horizontal dt"
      record_marker_label: "Name"
      max_records: 300
      field_map:
        "Name": full_name
        "License Status": status
        "Issued Date": issue_date
        "Expire Date": expiration_date
        "Inactive Date": expiration_date
        "License Number": license_number
        "License Type": license_type
        "Confirmation #": confirmation_number
        "Discipline": discipline
  has_detail_page: false

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "Inactive": inactive
    "Lapsed": expired
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: false
  capture_screenshot: false
  capture_on: ["error"]
  storage: local
  local_path: "./evidence/NC_DIETETICS/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
