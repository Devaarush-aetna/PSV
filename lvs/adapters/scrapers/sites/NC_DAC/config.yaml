identity:
  source_id: "NC_DAC"
  board_name: "North Carolina Substance Abuse Professional Practice Board"
  state: "NC"
  country: "US"
  profession_codes: ["LCAS","LCAS-A","CCS","CADC"]
  base_url: "https://ncsappb.learningbuilder.com/Public/PractitionerLookup/Search"
  archetype: classic_html_form

search:
  # LearningBuilder portal requires BOTH first and last name — single-field searches
  # return a "check spelling" page that mis-parses as candidates. Only first_and_last
  # is supported: primary input #LastName, extra input #FirstName filled with {first}.
  modes:
    - mode: first_and_last
      input_selector: "#LastName"
      button_selector: 'input[type="submit"][value="Verify"]'
      extra_inputs:
        "#FirstName": "{first}"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#LastName"
    search_button:
      selector: 'input[type="submit"][value="Verify"]'
  results_wait:
    strategy: network_idle
    selector: "table tr"
    timeout_ms: 25000
    # LearningBuilder renders its empty-result page with label text and a
    # "check spelling" hint (no data <tr> rows). Without these indicators the
    # extractor parsed that label/error text as phantom candidates, producing
    # bogus name-mismatch failures instead of a clean no_records. Match every
    # phrasing the portal is known to emit.
    no_results_indicators:
      - "no records found"
      - "no matching"
      - "no results"
      - "no licensees"
      - "0 records"
      - "check your spelling"
      - "check spelling"
      - "please try again"
      - "were no results"
      - "no records were found"
      - "returned no results"
      - "no practitioners"
      - "no practitioners found"
      - "0 practitioners"

results:
  type: table
  table:
    # :has(td:first-child a) skips header rows that migrated into <tbody> after a
    # portal update — only data rows carry an <a> link in the first (Name) cell.
    row_selector: "table tbody tr:has(td:first-child a)"
    cell_selector: "td"
    skip_first_row: false
    # Verified columns (live site): Name | Credential | NCSAPPB ID | City | State
    # The Name cell (col 0) anchor links to an HTML credential-verification page;
    # the engine navigates the browser there and lets AI fallback extract the fields.
    columns:
      0: full_name
      1: license_type
      2: license_number
      3: city
      4: state
    # Drop any parsed row that lacks a credential id and name — a genuine NCSAPPB
    # result always carries both. This is the second line of defence (after the
    # no_results_indicators above) against label/error rows being scored as
    # phantom candidates.
    required_fields: ["full_name", "license_number"]
  has_detail_page: true
  detail_trigger:
    type: link_in_cell
    selector: "table tbody tr td:nth-child(1) a"
  pagination:
    enabled: true
    strategy: next_button
    next_selector: "a[href*='_p='][href*='_o=LastName']:last-of-type"

detail:
  wait:
    strategy: element_visible
    selector: "p, div.body, div.content"
    timeout_ms: 15000
    fallback_selectors:
      - "p"
      - "body"
  back_navigation:
    strategy: browser_back
    wait_after_ms: 2000
  strategies: []
  # AI fallback handles extraction from the LearningBuilder HTML verification page
  # (the page contains a paragraph like "...confirm that NAME received CREDENTIAL
  #  LCAS-NNNNN on MM/DD/YYYY. This credential will expire on MM/DD/YYYY...").
  field_map:
    "License Number": license_number
    "NCSAPPB ID": license_number
    "Certificate No.": license_number
    "Certificate No": license_number
    "License No": license_number
    "Name": full_name
    "Full Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "Status": status
    "License Status": status
    "Credential": license_type
    "License Type": license_type
    "Expiration Date": expiration_date
    "Expiration": expiration_date
    "Exp Date": expiration_date
    "Renewal Date": expiration_date
    "Expires": expiration_date
    "Certificate Expiration": expiration_date
    "Issue Date": issue_date
    "Issued": issue_date
    "Issued Date": issue_date
    "Approved": issue_date
    "City": city
    "State": state

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Deceased": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_DAC/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
