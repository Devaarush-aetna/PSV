identity:
  source_id: "NC_MEDBOARD"
  board_name: "North Carolina Medical Board"
  state: "NC"
  country: "US"
  profession_codes: ["MD", "DO", "PA", "PH", "OR"]
  # Portal: https://www.ncmedboard.org/public_records
  # Portal is captcha/challenge-protected — automated scraping is not reliably possible.
  base_url: "https://www.ncmedboard.org/public_records"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "input[name='license'], input[id*='license'], input[id*='License']"
      button_selector: "input[type='submit'], button[type='submit']"
    - mode: last_name
      input_selector: "input[name='last'], input[id*='last'], input[id*='Last']"
      button_selector: "input[type='submit'], button[type='submit']"
    - mode: first_name
      input_selector: "input[name='first'], input[id*='first'], input[id*='First']"
      button_selector: "input[type='submit'], button[type='submit']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[name='last']"
    search_button:
      selector: "input[type='submit'], button[type='submit']"
  results_wait:
    strategy: network_idle
    selector: "table tr, .result"
    timeout_ms: 30000
    no_results_indicators:
      - "no records found"
      - "no matching"
      - "no results"
      - "0 results"

results:
  type: table
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    columns:
      0: full_name
      1: license_number
      2: license_type
      3: status
      4: expiration_date
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies:
    - type: two_column_table
    - type: dt_dd
    - type: label_sibling
  field_map:
    "License Number": license_number
    "Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "Status": status
    "License Status": status
    "License Type": license_type
    "Expiration Date": expiration_date
    "Renewal Date": expiration_date
    "Issue Date": issue_date
    "City": city
    "State": state_code

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Full and Unrestricted": active
    "Limited": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Surrendered": revoked
    "Probation": suspended
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%B %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_MEDBOARD/{run_id}/"

compliance:
  tos_review_date: "2026-07-30"
  requires_captcha: true
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
  skip: true
  skip_reason: "captcha_protected: NC Medical Board public records portal uses captcha/challenge protection — route NC MD/DO/PA/PH to manual verification"
