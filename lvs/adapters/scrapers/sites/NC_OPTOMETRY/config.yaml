identity:
  source_id: "NC_OPTOMETRY"
  board_name: "North Carolina State Board of Examiners in Optometry"
  state: "NC"
  country: "US"
  profession_codes: ["OD"]
  base_url: "https://www.ncoptometry.org/verify-a-license"
  archetype: classic_html_form

# 2026-07-29: The licensee search form is embedded inside a deeply nested iframe chain:
#   main (ncoptometry.org) → gstatic.com intermediate → googleusercontent.com inner
#   → about:blank (contains the actual search input and results table)
# content_frame() cannot traverse this chain. Use search_frame_probe_selector +
# iframe_probe_selector to scan all page.frames for the frame containing the input.
# Live verified: frame URL=about:blank, input placeholder="Enter License Number or Doctor Name",
# results table has columns: Name | License Number | Initial License Date | License Expires | Status | Disciplines
search:
  # Board accepts: Last Name | First Name | "Last Name, First Name" | License Number.
  # first_and_last / first_mid_last modes use query_template to format "Last, First"
  # so the board returns a precise single-person result rather than a broad last-name list.
  modes:
    - mode: license_number
      input_selector: "input[placeholder='Enter License Number or Doctor Name']"
      button_selector: "button"
    - mode: last_name
      input_selector: "input[placeholder='Enter License Number or Doctor Name']"
      button_selector: "button"
    - mode: first_name
      input_selector: "input[placeholder='Enter License Number or Doctor Name']"
      button_selector: "button"
    - mode: first_and_last
      input_selector: "input[placeholder='Enter License Number or Doctor Name']"
      button_selector: "button"
      query_template: "{last}, {first}"
    - mode: first_mid_last
      input_selector: "input[placeholder='Enter License Number or Doctor Name']"
      button_selector: "button"
      query_template: "{last}, {first}"
  search_frame_probe_selector: "input[placeholder='Enter License Number or Doctor Name']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[placeholder='Enter License Number or Doctor Name']"
    search_button:
      selector: "button"
  results_wait:
    strategy: delay
    timeout_ms: 5000
    no_results_indicators:
      - "no results"
      - "no records"
      - "no match"

results:
  type: table
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    # Verified columns (live): Name | License Number | Initial License Date | License Expires | Status | Disciplines
    columns:
      0: full_name
      1: license_number
      2: issue_date
      3: expiration_date
      4: status
      5: license_type
    iframe_probe_selector: "input[placeholder='Enter License Number or Doctor Name']"
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "License Number": license_number
    "Name": full_name
    "Status": status

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "Expired": expired
    "expired": expired
  date_formats:
    - "%m/%d/%Y"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_OPTOMETRY/{run_id}/"

compliance:
  tos_review_date: "2026-07-29"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
