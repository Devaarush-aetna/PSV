identity:
  source_id: IBCLC_COMMISSION
  board_name: International Board of Lactation Consultant Examiners — Public Registry
  state: ALL
  country: US
  profession_codes: [IBCLC, LC]
  # The public registry at ibclc-commission.org embeds a Clarus credential form in an
  # iframe. The engine navigates to the outer page, switches to the iframe to fill the
  # search form, then reads results from the outer page after the iframe submit triggers
  # a parent-page navigation to ?data={"name_search":"..."}.
  base_url: "https://iblce.useclarus.com/view/anonpages/c/credential_results"
  archetype: classic_html_form

search:
  iframe_search_selector: "iframe[src*='dynamic_form']"
  # IBLCE credential numbers with a letter prefix require a dash: "L301745" → "L-301745".
  # license_prefix_dash adds a synthetic license_formatted attempt for these inputs.
  license_prefix_dash: true
  modes:
    - mode: last_name
      input_selector: "input[name='name_search']"
    - mode: license_and_last
      # license_* modes use license_number as primary → fill credential_number directly.
      # last name goes into name_search as an extra_input so both filters are applied.
      input_selector: "input[name='credential_number']"
      extra_inputs:
        "input[name='name_search']": "{last}"
    - mode: first_and_last
      input_selector: "input[name='name_search']"
      extra_inputs:
        "input[name='name_search']": "{last}"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[name='name_search']"
    search_button:
      selector: "button[name='save_button']"
      fallback_selectors:
        - "button[type='submit']"
  results_wait:
    strategy: network_idle
    timeout_ms: 20000
    no_results_indicators:
      - "no matching records"
      - "no records found"
      - "0 records"
      - "no results"
      - "search returned too many results"

# Results are rendered in the parent page after the iframe triggers navigation.
# Table columns (0-indexed): 0=credential_number, 1=full_name, 2=name_primary_lang,
# 3=country, 4=expiration_date
results:
  type: table
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    columns:
      0: license_number
      1: full_name
      4: expiration_date
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map:
    "Credential Number": license_number
    "Name": full_name
    "Expiration Date": expiration_date
    "Status": status

output:
  status_map:
    "Active": active
    "ACTIVE": active
    "Current": active
    "current": active
    "Inactive": inactive
    "INACTIVE": inactive
    "Expired": expired
    "EXPIRED": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%Y-%m-%d"
    - "%m/%d/%Y"
    - "%m-%d-%Y"
    - "%B %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [1000, 2000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/IBCLC_COMMISSION/{run_id}/"

compliance:
  tos_review_date: "2026-07-01"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
