<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nevada State Board of Osteopathic Medicine — License Verification</title>
  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/portal.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .header-bar { background: #003366; color: #fff; padding: 12px 20px; }
    .header-bar h1 { font-size: 1.4em; margin: 0; }
    .search-panel { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 20px; margin: 20px; }
    .btn-brand { background: #003366; color: #fff; border: none; padding: 6px 16px; border-radius: 3px; cursor: pointer; }
    .results-panel { background: #fff; border: 1px solid #ddd; border-radius: 4px; margin: 0 20px 20px 20px; padding: 10px; }
    table { width: 100%; border-collapse: collapse; }
    table th { background: #003366; color: #fff; padding: 8px 10px; text-align: left; font-size: 0.9em; }
    table td { padding: 7px 10px; border-bottom: 1px solid #eee; font-size: 0.88em; }
    .no-records-row td { text-align: center; color: #888; font-style: italic; padding: 16px; }
    .result-count { font-size: 0.85em; color: #555; margin: 8px 10px; }
  </style>
</head>
<body>

<div class="header-bar">
  <h1>Nevada State Board of Osteopathic Medicine — License Verification</h1>
</div>

<div class="search-panel">
  <h3>Search Licensees</h3>
  <p>Enter a last name, first name, or license number to search the registry.</p>
  <div class="row" style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
    <div>
      <label for="keywords">Search</label><br>
      <input id="keywords" type="text" class="form-control" value="ZZZNoSuchLicensee" placeholder="Enter last name, first name, or license number" style="width:320px; padding:5px 8px; border:1px solid #ccc; border-radius:3px;">
    </div>
    <div>
      <button class="btn-brand">Search</button>
    </div>
    <div>
      <button style="background:#888; color:#fff; border:none; padding:6px 14px; border-radius:3px; cursor:pointer;">Clear</button>
    </div>
  </div>
</div>

<div class="results-panel">
  <div class="result-count">Showing <strong>0</strong> results for "ZZZNoSuchLicensee"</div>
  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>License #</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>City</th>
        <th>License Type</th>
        <th>Status</th>
        <th>Expiration Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr class="no-records-row">
        <td colspan="8">No records found.</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
