identity:
  source_id: WA_HEALTH
  board_name: Washington State Department of Health — Health Care Provider Credential Data
  state: WA
  country: US
  profession_codes: [RN, LPN, MD, DO, DDS, DMD, PA, PT, OT, RT, PharmD, SW]
  # Socrata JSON API — dataset qxh8-f4bd on data.wa.gov.
  # socrata_bulk_csv archetype uses Playwright browser page.goto() (not APIRequestContext)
  # so it works through corporate Zscaler SSL inspection that blocks bare TLS clients.
  base_url: "https://data.wa.gov/resource/qxh8-f4bd.json"
  archetype: socrata_bulk_csv

search:
  # input_selector = Socrata field name (lowercase, no spaces) used in SoQL WHERE clause.
  modes:
    - mode: license_number
      input_selector: "credentialnumber"
    - mode: last_name
      input_selector: "lastname"
    - mode: first_name
      input_selector: "firstname"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: ""
    search_button:
      selector: ""
  results_wait:
    strategy: delay
    timeout_ms: 1000

results:
  type: table
  has_detail_page: false

# Socrata JSON field names → canonical engine field names.
detail:
  field_map:
    "credentialnumber": license_number
    "lastname": last_name
    "firstname": first_name
    "middlename": middle_name
    "credentialtype": license_type
    "status": status
    "firstissuedate": issue_date
    "lastissuedate": last_renewal_date
    "expirationdate": expiration_date
    "ceduedate": raw_ce_due
    "birthyear": raw_birth_year
    "actiontaken": raw_action_taken

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "inactive": inactive
    "INACTIVE": inactive
    "Expired": expired
    "expired": expired
    "EXPIRED": expired
    "Lapsed": expired
    "lapsed": expired
    "Suspended": suspended
    "suspended": suspended
    "SUSPENDED": suspended
    "Revoked": revoked
    "revoked": revoked
    "REVOKED": revoked
    "Cancelled": revoked
    "cancelled": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%dT%H:%M:%S.%f"
    - "%Y-%m-%dT%H:%M:%S"
    - "%Y-%m-%d"
    - "%m/%d/%y"
    - "%B %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1000
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: false
  capture_screenshot: false
  capture_on: ["error"]
  storage: local
  local_path: "./evidence/{source_id}/{run_id}/"

compliance:
  tos_review_date: "2026-06-04"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: license_number
  query: "RN.RN.61663091"
  expect:
    license_number: "RN.RN.61663091"
    status: "active"
    full_name_contains: "Smith"
