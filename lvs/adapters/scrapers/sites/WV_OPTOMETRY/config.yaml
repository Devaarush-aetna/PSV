identity:
  source_id: WV_OPTOMETRY
  board_name: West Virginia Board of Optometry
  state: WV
  country: US
  profession_codes: [OD]
  # Certemy Angular SPA at wvbo.certemy.com.
  # Live HTML confirmed: input placeholder="Type to search" class="search-input".
  # Same live-filter Angular table pattern as all Certemy boards.
  # Live column headers discovered 2026-06-10:
  #   First name, Last name, License Number, Expiration Status, Initial License Date,
  #   Renewal Date, Expiration date, Disciplinary Action, Laser Certified, YAG CAP,
  #   SLT, LPI, Telehealth, Practice Address 1, Practice Address 2, City, State, Zip Code, County
  base_url: "https://wvbo.certemy.com/public-registry/0ee899c3-0585-4788-a489-2fd4fa363bae"
  archetype: certemy

search:
  modes:
    - mode: last_name
    - mode: license_number
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input.search-input"
    search_button:
      selector: "input.search-input"
  results_wait:
    strategy: network_idle
    selector: "table tbody tr"
    timeout_ms: 30000
    no_results_indicators:
      - "no results"
      - "no records"

results:
  type: table
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    skip_first_row: false
    columns:
      0: full_name
      1: license_number
      2: license_type
      3: status
      4: expiration_date
  has_detail_page: false
  pagination:
    enabled: true
    strategy: next_button
    next_selector: "[aria-label='Next page'], .mat-paginator-navigation-next"

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map:
    "First name": first_name
    "Last name": last_name
    "License Number": license_number
    "Expiration Status": status
    "Initial License Date": issue_date
    "Expiration date": expiration_date
    "Practice Address 1": address
    "City": city
    "State": state_code
    "Zip Code": zip_code

output:
  status_map:
    "Active": active
    "active": active
    "Not Expired": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%Y-%m-%d"
    - "%m/%d/%Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1440
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 90000
  rate_limit:
    delay_between_requests_ms: 1000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/WV_OPTOMETRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-10"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
