identity:
  source_id: MD_ACUPUNCTURE_WEB
  board_name: Maryland Board of Acupuncture (Web Verification)
  state: MD
  country: US
  profession_codes: ["LAc"]
  # Secondary source for MD Acupuncture — used when the primary CSV-based board
  # (MD_ACUPUNCTURE, acupactive.csv) returns no records.  The CSV only contains
  # active licenses; this ASP.NET WebForms portal (same mdbnc domain as MD_PT,
  # MD_CHIROPRACTIC, etc.) returns all statuses including expired and inactive.
  base_url: "https://mdbnc.health.maryland.gov/ACUPTVerification/Default.aspx"
  archetype: classic_html_form

search:
  # bodyContentPlaceHolder_* prefix — same template as MD_OT (OTVerification).
  # Two independent search areas: one for last name, one for license number.
  modes:
    - mode: license_number
      input_selector: "#bodyContentPlaceHolder_licenseNoSearch"
      button_selector: "#bodyContentPlaceHolder_search2"
    - mode: last_name
      input_selector: "#bodyContentPlaceHolder_lastNameSearch"
      button_selector: "#bodyContentPlaceHolder_search1"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#bodyContentPlaceHolder_lastNameSearch"
    search_button:
      selector: "#bodyContentPlaceHolder_search1"
  results_wait:
    strategy: element_visible
    selector: "a:has-text('View Details')"
    timeout_ms: 20000
    no_results_indicators:
      - "no records found"
      - "no match"
      - "not found"
      - "0 records"
      - "did not produce any results"

results:
  type: table
  table:
    row_selector: "tbody tr"
    cell_selector: "td"
    skip_first_row: true
    columns:
      0: last_name
      1: first_name
      2: license_number
  has_detail_page: true
  detail_trigger:
    type: link_in_cell
    selector: "a:has-text('View Details')"
  pagination:
    enabled: true
    strategy: next_button
    next_selector: "a#MainContent_btnNext"
    disabled_class: "aspNetDisabled"

detail:
  wait:
    strategy: element_visible
    selector: "#bodyContentPlaceHolder_DetailsView1"
    timeout_ms: 15000
  strategies:
    - type: two_column_table
  field_map:
    "Full Name": full_name
    "License Number": license_number
    "Status": status
    "License Status": status
    "License Type": license_type
    "Original Lic Date": issue_date
    "Issue Date": issue_date
    "License Expiration Date": expiration_date
    "Expiration Date": expiration_date
    "Disciplinary Action": disciplinary_action
  back_navigation:
    strategy: browser_back
    wait_after_ms: 1500

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "inactive": inactive
    "INACTIVE": inactive
    "Expired": expired
    "expired": expired
    "EXPIRED": expired
    "Non-renewed": expired
    "Non Renewed": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
    "Cancelled": inactive
    "Retired": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "Evidence/MD_ACUPUNCTURE_WEB/{run_id}/"

compliance:
  tos_review_date: "2026-07-10"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
