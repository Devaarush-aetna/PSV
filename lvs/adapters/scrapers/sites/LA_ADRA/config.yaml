identity:
  source_id: LA_ADRA
  board_name: Louisiana ADRA Board (Drug & Alcohol Counselors)
  state: LA
  country: US
  profession_codes: [DAC]
  # Certemy Angular SPA — live-filter table at app.certemy.com.
  # Search: input.search-input (no submit button; Angular reactive live filter).
  # Results: standard HTML table with thead headers + tbody rows.
  # Pagination: Material Design paginator (.mat-paginator-navigation-next).
  # No per-row detail page — all fields present in table row cells.
  # Live column headers discovered 2026-06-10:
  #   Last name, First name, Credential Type, Number, Expiration Status,
  #   Expiration date, Date of Registration, Employer, Employer City,
  #   Clinical Supervisor Name, Disciplinary Action
  base_url: "https://app.certemy.com/public-registry/8ca73d3d-b51c-42b9-9e44-892b2411d264"
  archetype: certemy

search:
  modes:
    - mode: last_name
    - mode: license_number
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input.search-input"
    search_button:
      selector: "input.search-input"
  results_wait:
    strategy: network_idle
    selector: "table tbody tr"
    timeout_ms: 30000
    no_results_indicators:
      - "no results"
      - "no records"

results:
  type: table
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    skip_first_row: false
    columns:
      0: full_name
      1: license_number
      2: license_type
      3: status
      4: expiration_date
  has_detail_page: false
  pagination:
    enabled: true
    strategy: next_button
    next_selector: "[aria-label='Next page'], .mat-paginator-navigation-next"

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map:
    "Last name": last_name
    "First name": first_name
    "Credential Type": license_type
    "Number": license_number
    "Expiration Status": status
    "Expiration date": expiration_date
    "Date of Registration": issue_date

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Not Expired": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "revoked": revoked
  date_formats:
    - "%Y-%m-%d"
    - "%m/%d/%Y"
    - "%m-%d-%Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1440
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 90000
  rate_limit:
    delay_between_requests_ms: 1000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/LA_ADRA/{run_id}/"

compliance:
  tos_review_date: "2026-06-10"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
