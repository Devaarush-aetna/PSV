identity:
  source_id: "OR_COUNSELORS"
  board_name: "Oregon Board of Licensed Professional Counselors and Therapists"
  state: "OR"
  country: "US"
  profession_codes: ["LPC", "LMFT"]
  base_url: "https://oblpct.us.thentiacloud.net/webs/oblpct/register/#"
  archetype: "thentia_cloud"

search:
  # oblpct.us.thentiacloud.net has NO Search By dropdown — single keyword input.
  modes:
    - mode: "license_number"
    - mode: "last_name"
    - mode: "first_name"
  form:
    search_by_dropdown:
      strategy: "none"
    search_input:
      selector: "input#keywords"
      fallback_selectors:
        - "input[name='keywords']"
    search_button:
      selector: "button.btn-brand"
      fallback_selectors:
        - "[aria-label='Search']"
        - "button[type='submit']"
        - "a.btn-single"
  submit_via_enter: true
  results_wait:
    strategy: "element_visible"
    selector: "table tbody tr"
    timeout_ms: 30000
    no_results_indicators:
      - "showing results 1-0 of 0"
      - "no records found"
      - "no results were found"

results:
  type: "table"
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    columns:
      0: "name"
      1: "license_number"
      2: "license_type"
      3: "status"
  has_detail_page: false
  detail_trigger:
    type: "view_button"
    selector: "a[href*='#profile'], a:has-text('View'), button:has-text('View')"
  pagination:
    enabled: true
    strategy: "next_button"
    next_selector: "[ng-click*='nextPageStart'], a[title='Next Page']"
    disabled_class: "disabled"

detail:
  wait:
    strategy: "url_change"
    timeout_ms: 15000
    fallback_selectors:
      - "div[class*='profile']"
      - "dl"
  strategies:
    - type: "dt_dd"
    - type: "label_sibling"
    - type: "field_label_value"
    - type: "two_column_table"
  field_map:
    "License Number": "license_number"
    "License #": "license_number"
    "Name": "full_name"
    "First Name": "first_name"
    "Last Name": "last_name"
    "License Type": "license_type"
    "Status": "status"
    "Issue Date": "issue_date"
    "Expiration Date": "expiration_date"
    "Address": "address"
    "City": "city"
    "State": "state_code"
  back_navigation:
    strategy: "browser_back"
    wait_after_ms: 1500

output:
  status_map:
    "active": "active"
    "Active": "active"
    "inactive": "inactive"
    "expired": "expired"
    "suspended": "suspended"
    "revoked": "revoked"
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%B %d, %Y"

transport:
  browser: "chromium"
  headless: true
  viewport:
    width: 1920
    height: 1080
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: "local"
  local_path: "./evidence/OR_COUNSELORS/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
