identity:
  source_id: MA_BSAS
  board_name: Massachusetts Bureau of Substance Addiction Services
  state: MA
  country: US
  profession_codes: [LADC]
  # Classic JSP server-side portal. Search by first/last name only (no license# input).
  # Results rendered as div.data_group_grid_container cards — 6 spans per card in order:
  # last_name, first_name, license_number, license_type, issue_date, expiration_date.
  # No status column in results; disciplinary note in div.disciplinary_action_message (not a span).
  base_url: "https://hhsvgapps03.hhs.state.ma.us/elicensing-pubweb/couns/lookup.htm"
  archetype: classic_html_form

search:
  modes:
    - mode: last_name
      input_selector: "input#lastName"
      button_selector: "input[value='Search']"
    - mode: first_name
      input_selector: "input#firstName"
      button_selector: "input[value='Search']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input#lastName"
    search_button:
      selector: "input[value='Search']"
  results_wait:
    strategy: network_idle
    timeout_ms: 20000
    no_results_indicators:
      - "no results"
      - "no records found"
      - "0 results"

results:
  type: table
  table:
    row_selector: "div.data_group_grid_container"
    cell_selector: "span"
    skip_first_row: false
    columns:
      0: last_name
      1: first_name
      2: license_number
      3: license_type
      4: issue_date
      5: expiration_date
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map: {}
  date_formats:
    - "%b %d, %Y"
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/MA_BSAS/{run_id}/"

compliance:
  tos_review_date: "2026-06-17"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
