identity:
  source_id: NV_MASSAGE
  board_name: Nevada State Board of Massage Therapists
  state: NV
  country: US
  profession_codes: [MT]
  base_url: "https://online.nvmassagebd.com/ui/search.aspx"
  archetype: classic_html_form

# ASP.NET WebForms portal with UpdatePanel (AJAX partial-page update).
# Confirmed live field IDs (ContentPlaceHolder1_Search1_* prefix):
#   txtLastName, txtFirstName, txtLicenseNo, btnSearch
# Results render in table#gvLicensee (10 rows for "Smith").
# network_idle fires before the UpdatePanel XHR starts — must use element_visible.
search:
  modes:
    - mode: license_number
      input_selector: "input[id$='txtLicenseNo']"
      button_selector: "input[id$='btnSearch']"
    - mode: last_name
      input_selector: "input[id$='txtLastName']"
      button_selector: "input[id$='btnSearch']"
    - mode: first_name
      input_selector: "input[id$='txtFirstName']"
      button_selector: "input[id$='btnSearch']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[id$='txtLastName']"
    search_button:
      selector: "input[id$='btnSearch']"
  results_wait:
    strategy: element_visible
    selector: "table[id$='gvLicensee'] tr td"
    timeout_ms: 25000
    no_results_indicators:
      - "no results"
      - "no records found"
      - "0 result"
      - "no match"
      - "no licensees found"
      - "nothing found"
      - "no data"

results:
  type: table
  table:
    table_selector: "table[id$='gvLicensee']"
    table_index: 0
    row_selector: "tr"
    cell_selector: "td"
    skip_first_row: true
    # Confirmed column order from live site: Name | License# | Status | City | State | Action
    columns:
      0: full_name
      1: license_number
      2: status
      3: city
      4: state_code
  has_detail_page: false
  pagination:
    enabled: true
    strategy: next_button
    next_button_selector: "a:has-text('>')"

detail:
  wait:
    strategy: delay
    timeout_ms: 2000
  strategies:
    - type: dt_dd
    - type: label_sibling
    - type: two_column_table
    - type: four_column_table
  field_map:
    "License Number": license_number
    "License No": license_number
    "License #": license_number
    "Name": full_name
    "Licensee Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "License Type": license_type
    "Type": license_type
    "Status": status
    "License Status": status
    "Expiration Date": expiration_date
    "Expire Date": expiration_date
    "Expiration": expiration_date
    "Issue Date": issue_date
    "Issued": issue_date
    "City": city
    "State": state_code
    "Address": address
  back_navigation:
    strategy: browser_back
    wait_after_ms: 1500

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "inactive": inactive
    "INACTIVE": inactive
    "Expired": expired
    "expired": expired
    "EXPIRED": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
    "Cancelled": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NV_MASSAGE/{run_id}/"

compliance:
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
