identity:
  source_id: "NC_MASSAGE"
  board_name: "North Carolina Board of Massage and Bodywork Therapy"
  state: "NC"
  country: "US"
  profession_codes: ["LMBT"]
  base_url: "http://www.theconjuredsolution.com/aspsearch/ncmassx_search.asp"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#License"
      button_selector: 'input[name="QS_Submit"]'
    - mode: last_name
      input_selector: "#Last_Name"
      button_selector: 'input[name="QS_Submit"]'
    - mode: first_name
      input_selector: "#First_Name"
      button_selector: 'input[name="QS_Submit"]'
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#Last_Name"
    search_button:
      selector: 'input[name="QS_Submit"]'
  results_wait:
    strategy: network_idle
    selector: "table tr"
    timeout_ms: 25000
    no_results_indicators:
      - "no records found"
      - "no matching"
      - "no results"
      - "no licensees"
      - "0 records"

results:
  type: table
  table:
    row_selector: "table#masterDataTable > tbody > tr"
    cell_selector: "td"
    skip_first_row: true
    columns:
      0: full_name
      1: license_number
      2: city
      3: status
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "License Number": license_number
    "Name": full_name
    "Status": status
    "License Type": license_type
    "First Name": first_name
    "Last Name": last_name

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Deceased": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_MASSAGE/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
