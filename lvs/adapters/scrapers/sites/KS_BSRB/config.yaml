identity:
  source_id: KS_BSRB
  board_name: Kansas Behavioral Sciences Regulatory Board
  state: KS
  country: US
  profession_codes: [LSCSW, LMSW, LCP, LCPC, LMFT]
  base_url: "https://licensing.ks.gov/Verification_BSRB/Search.aspx"
  archetype: classic_html_form

search:
  # "LCPC03720" → "LCPC 03720": insert space between letter prefix and digits.
  license_alpha_space_insert: true
  # For pure-digit inputs like "03192", try with each prefix in order.
  license_digit_prefixes: [LSCSW, LMSW, LCP, LCPC, LPC, LMFT]
  modes:
    - mode: license_number
      input_selector: "input#t_web_lookup__license_no"
    - mode: last_name
      input_selector: "input#t_web_lookup__last_name"
    - mode: first_name
      input_selector: "input#t_web_lookup__first_name"
    - mode: first_and_last
      input_selector: "input#t_web_lookup__last_name"
      extra_inputs:
        "input#t_web_lookup__first_name": "{first}"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input#t_web_lookup__license_no"
    search_button:
      selector: "input#sch_button"
  results_wait:
    strategy: network_idle
    timeout_ms: 20000
    no_results_indicators:
      - "no results"
      - "no records found"
      - "0 result"

results:
  type: table
  table:
    row_selector: "table tr"
    cell_selector: "td"
    # Actual columns (direct TDs): Name | License# | Profession | LicenseType | Status | Address
    # custom_js overrides the above index mapping; row_selector/cell_selector are fallback only.
    custom_js: |
      (() => {
        const tbl = document.getElementById('datagrid_results');
        if (!tbl) return [];
        const tbody = tbl.querySelector('tbody') || tbl;
        const rows = tbody.querySelectorAll(':scope > tr');
        const results = [];
        for (const row of rows) {
          const tds = row.querySelectorAll(':scope > td');
          if (tds.length < 4) continue;
          const nameEl = tds[0].querySelector('a[href*="Details.aspx"]');
          const fullName = nameEl
            ? nameEl.textContent.trim()
            : (tds[0].textContent || '').split('\n')[0].trim();
          if (!fullName) continue;
          const licNum = (tds[1].textContent || '').trim();
          const profession = (tds[2].textContent || '').trim();
          const licTypeEl = tds[3].querySelector('span[id*="license_type"]')
                         || tds[3].querySelector('span');
          const licType = licTypeEl
            ? licTypeEl.textContent.trim()
            : (tds[3].textContent || '').split('\n')[0].trim();
          const status = tds[4] ? (tds[4].textContent || '').trim() : '';
          results.push({
            full_name: fullName,
            license_number: licNum,
            profession: profession,
            license_type: licType,
            status: status
          });
        }
        return results;
      })()
    columns:
      0: "full_name"
      1: "license_number"
      2: "profession"
      3: "license_type"
      4: "status"
  single_result_url_pattern: "Details.aspx"
  has_detail_page: true
  detail_trigger:
    type: link_in_cell
    # Original script opens detail in new window; engine navigates same tab.
    # If target="_blank" on the link, use the href directly via url_navigate back nav.
    selector: "a[href*='Details.aspx']"
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: url_change
    timeout_ms: 15000
  strategies:
    - type: field_label_value
    - type: two_column_table
    - type: four_column_table
    - type: dt_dd
    - type: label_sibling
  field_map:
    "First": first_name
    "First Name": first_name
    "Middle": licensee_middle_name
    "Last": last_name
    "Last Name": last_name
    "Full Name": full_name
    "Name": full_name
    "Lic #": license_number
    "License No": license_number
    "License #": license_number
    "License Number": license_number
    "Profession": license_type
    "Lic Type": license_type
    "License Type": license_type
    "Lic Status": status
    "Status": status
    "License Status": status
    "Lic Expiration": expiration_date
    "Expiration Date": expiration_date
    "Expire Date": expiration_date
    "Lic Issued": issue_date
    "Issue Date": issue_date
    "Address": address
    "City": city
    "State": state_code
    "Zip": zip_code
    "Zip Code": zip_code
  back_navigation:
    strategy: browser_back
    wait_after_ms: 1000

output:
  status_map:
    "Active": active
    "active": active
    "Current": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "navigation_error", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "Evidence/KS_BSRB/{run_id}/"

compliance:
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: license_number
  query: "LSCSW 4719"
  expect:
    license_number: "LSCSW 4719"
    status: "active"
    full_name_contains: "Smith"
