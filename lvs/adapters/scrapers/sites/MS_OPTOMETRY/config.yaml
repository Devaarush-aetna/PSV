identity:
  source_id: MS_OPTOMETRY
  board_name: Mississippi State Board of Optometry
  state: MS
  country: US
  profession_codes: [OD]
  # Mississippi state portal at ms.gov. DataTables client-side filtered table (table#LicenseTable).
  # The full license roster is loaded at page load; jQuery DataTables global search filters rows.
  # Each data row contains a single td.lic cell with multi-line text:
  #   line 0: LAST, FIRST (name)
  #   subsequent lines: address, "License #: N", "TPA #: N", "Expire Date: D",
  #                     "Original Issue Date: D", "DPA: Y/N", "Status: S",
  #                     "Disciplinary Action: None/Yes"
  # Pagination via #LicenseTable_next (disabled class when on last page).
  base_url: "https://www.ms.gov/msbo/license_renewal/home/licenseverification"
  archetype: datatables_jsapi

datatables:
  table_selector: "table#LicenseTable"
  # -1 = global filter (api.search(q).draw()); no specific column to search
  column_index:
    last_name: -1
    license_number: -1
  settle_ms: 1500

search:
  modes:
    - mode: last_name
    - mode: license_number
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[type='search']"
    search_button:
      selector: ""
  results_wait:
    strategy: element_visible
    selector: "table#LicenseTable tbody tr:has(td.lic)"
    timeout_ms: 20000
    no_results_indicators:
      - "No matching records found"
      - "no matching records"
      - "0 records"

results:
  type: table
  table:
    row_selector: "table#LicenseTable tbody tr:has(td.lic)"
    cell_selector: "td.lic"
    skip_first_row: false
    columns:
      # td.lic inner_text() starts with the licensee name on the first line
      0: full_name
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map:
    "ACTIVE": active
    "Active": active
    "active": active
    "INACTIVE": inactive
    "Inactive": inactive
    "inactive": inactive
    "EXPIRED": expired
    "Expired": expired
    "expired": expired
    "SUSPENDED": suspended
    "Suspended": suspended
    "REVOKED": revoked
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1440
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/MS_OPTOMETRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-16"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
