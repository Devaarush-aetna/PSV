identity:
  source_id: "OK_BEHAVIORAL_HEALTH"
  board_name: "Oklahoma State Board of Behavioral Health Licensure"
  state: "OK"
  country: "US"
  profession_codes: ["LPC", "LMFT", "LBP", "LADC-MH"]
  # Thentia Cloud (AngularJS SPA) at obbhl.us.thentiacloud.net.
  # From oklahoma_state_board_of_behavioral_health_licensure.py:
  #   Single keyword input (input#keywords) searches ALL fields (name, city, state, zip,
  #   license type, Previous Names).
  #   Combined first+last name sent as single query when both given.
  #   Detail page has: License Info, Initial Registration Date, Supervisor Status,
  #   Disciplinary Action, Previous Names.
  #   Pagination via [ng-click*='nextPageStart'].
  base_url: "https://obbhl.us.thentiacloud.net/webs/obbhl/register/#"
  archetype: "thentia_cloud"

search:
  modes:
    - mode: "license_number"
      dropdown_value: "License Number"
    - mode: "last_name"
      dropdown_value: "Last Name"
    - mode: "first_name"
      dropdown_value: "First Name"
  form:
    search_by_dropdown:
      strategy: "select"
      selector: "select"
    search_input:
      selector: "input#keywords"
      fallback_selectors:
        - "input[placeholder*='search text']"
        - "input[placeholder*='Search']"
        - "input[type='text']"
        - "input[type='search']"
    search_button:
      selector: "button.btn-brand"
      fallback_selectors:
        - "[aria-label='Search']"
        - "button[type='submit']"
        - "img[alt*='search']"
  results_wait:
    strategy: "element_visible"
    selector: "table tbody tr"
    timeout_ms: 30000
    no_results_indicators:
      - "showing results 1-0 of 0"
      - "no records found"
      - "no results were found"

results:
  type: "table"
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    columns:
      0: "last_name"
      1: "first_name"
      2: "city"
      3: "state_code"
      4: "zip_code"
      5: "license_type"
      6: "status"
      7: "supervisor"
      8: "disciplinary_actions"
  has_detail_page: true
  detail_trigger:
    type: "view_button"
    selector: "button:has-text('View'), a:has-text('View'), input[value='View']"
  pagination:
    enabled: true
    strategy: "next_button"
    next_selector: "[ng-click*='nextPageStart'], a[title='Next Page'], a.next, [aria-label='Next']"
    disabled_class: "disabled"

detail:
  wait:
    strategy: "element_visible"
    timeout_ms: 15000
    fallback_selectors:
      - "div.profile"
      - "div[class*='profile']"
      - "div[class*='detail']"
      - "dl"
      - "dt"
  strategies:
    - type: "dt_dd"
    - type: "label_sibling"
    - type: "field_label_value"
    - type: "two_column_table"
  field_map:
    "License Number": "license_number"
    "License #": "license_number"
    "First Name": "first_name"
    "Last Name": "last_name"
    "Name": "full_name"
    "Previous Names": "previous_names"
    "License Type": "license_type"
    "License Status": "status"
    "Status": "status"
    "License Effective Date": "effective_date"
    "License Expiry Date": "expiration_date"
    "Expiration Date": "expiration_date"
    "Initial Registration Date": "issue_date"
    "City": "city"
    "State": "state_code"
    "Zip Code": "zip_code"
    "Approved Supervisor": "supervisor"
    "Disciplinary Action": "disciplinary_actions"
    "Supervisor Status": "supervisor_status"
    "Supervisor Expiration Date": "supervisor_expiration_date"
  back_navigation:
    strategy: "browser_back"
    wait_after_ms: 1500

output:
  status_map:
    "active": "active"
    "Active": "active"
    "Current": "active"
    "inactive": "inactive"
    "Inactive": "inactive"
    "expired": "expired"
    "Expired": "expired"
    "lapsed": "expired"
    "Lapsed": "expired"
    "suspended": "suspended"
    "Suspended": "suspended"
    "revoked": "revoked"
    "Revoked": "revoked"
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: "chromium"
  headless: true
  viewport:
    width: 1920
    height: 1080
  timeout_ms: 90000
  navigation_timeout_ms: 60000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36 Edg/136.0.0.0"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: "local"
  local_path: "Evidence/OK_BEHAVIORAL_HEALTH/{run_id}/"

compliance:
  tos_review_date: "2026-06-17"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Johnson"
  expect:
    min_records: 1
    full_name_contains: "Johnson"
  skip: true
  skip_reason: "thentiacloud_api_blocked_corporate: obbhl.us.thentiacloud.net Thentia search XHR API calls timeout from corporate network even with proxy (confirmed 2026-07-01 with PROXY=proxy:9119, 120s timeout). Works from residential/non-corporate network only."
