identity:
  source_id: "NC_PAB"
  board_name: "North Carolina Medical Board"
  state: "NC"
  country: "US"
  profession_codes: ["PAB"]
  base_url: ""
  archetype: classic_html_form
  skip: true
  skip_reason: "captcha_blocked: board search page requires CAPTCHA — manual verification required"

# CAPTCHA BLOCK: This board's search page is protected by a CAPTCHA.
# The engine cannot complete automated searches without captcha-solving support.
# All queries routed here will return no results until this is resolved.
search:
  modes:
    - mode: last_name
      input_selector: ""
      button_selector: ""
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: ""
    search_button:
      selector: ""
  results_wait:
    strategy: delay
    timeout_ms: 1000
    no_results_indicators: []

results:
  type: table
  table:
    row_selector: ""
    cell_selector: "td"
    columns: {}
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "Inactive": inactive
    "Expired": expired
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 1
    backoff_ms: [2000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: false
  capture_screenshot: false
  capture_on: ["error"]
  storage: local
  local_path: "Evidence/NC_PAB/{run_id}/"

compliance:
  tos_review_date: "2026-07-30"
  requires_captcha: true
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 0
  skip: true
  skip_reason: "captcha_blocked: board search page requires CAPTCHA — cannot automate until captcha handling is added"
