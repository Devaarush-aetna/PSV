identity:
  source_id: "NC_PT"
  board_name: "North Carolina Board of Physical Therapy Examiners"
  state: "NC"
  country: "US"
  profession_codes: ["PT", "PTA"]
  base_url: "https://www2.ncptboard.org/app/OnlineServices/VerifyTherapist/VerifyTherapist.php"
  archetype: classic_html_form

# 2026-08-03: Cloudflare WAF blocks the corporate proxy IP (Ray ID a2555bdf1fb2ef9d).
# AJAX form submit returns CF block page → #verifyresults never populates.
# Proxy disabled so browser connects directly with a non-flagged IP.
search:
  # The board shows a cookie consent banner on first load that obscures the form.
  # Click "Accept cookies" before filling the search form.
  # Cloudflare JS challenge runs after navigation and can take 25-40s before the
  # real page + cookie banner appear. Wait up to 45s for the button to become visible.
  pre_search_click: "button#cookie-consent-accept"
  pre_search_click_timeout_ms: 45000
  # After clicking the cookie button the Cloudflare JS challenge may still be running
  # (it takes 25-40s in a hidden iframe). Wait up to 40s for networkidle so CF resolves
  # before we submit the search form — otherwise AJAX is intercepted by CF and no results
  # arrive within the 45s results_wait window.
  post_pre_search_click_wait_ms: 40000
  modes:
    - mode: last_name
      input_selector: "input[name='LastName']"
      button_selector: "button#submitButton, button[type='submit']"
    - mode: first_name
      input_selector: "input[name='FirstName']"
      button_selector: "button#submitButton, button[type='submit']"
    - mode: license_number
      input_selector: "input[name='LicenseNumber']"
      button_selector: "button#submitButton, button[type='submit']"
  # NC PT board license designation prefixes (from ncptboard.org):
  #   P  = Physical Therapist (PT)
  #   A  = Physical Therapist Assistant (PTA)
  #   CP = Compact Privilege Holder (last char T=PT, A=PTA), e.g. CP024411T
  #   T  = Temporary Military Permit
  #   M  = Military Privilege
  #   O  = Temporary Privilege
  # The board search form requires the prefix: "Enter a 'P' for PT or 'A' for PTA
  # before the license number, e.g. P1234 or A1234."
  # Bare numeric inputs from the data are normalized here; licenses that already
  # start with a letter (CP024411T, P1234, A567, T123…) are passed through unchanged.
  license_prov_type_prefix_map:
    PT: "P"
    PTA: "A"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[name='LastName']"
    search_button:
      selector: "button#submitButton, button[type='submit']"
      fallback_selectors:
        - "button[type='submit']"
    # Small baseline wait so CF challenge JS has a chance to start.
    # post_pre_search_click_wait_ms (40s networkidle) handles waiting for CF to fully resolve.
    post_navigate_wait_ms: 5000
  results_wait:
    strategy: element_visible
    # Results are injected by AJAX into #verifyresults — wait for that div to contain rows.
    # The generic "table tbody tr td" must NOT be used: it matches Google Site Search
    # widget tables already on the page before any search is run, causing instant false hits.
    # 45s: CF JS challenge can take 10-20s to complete before AJAX fires.
    selector: "#verifyresults table tbody tr"
    timeout_ms: 45000
    no_results_indicators:
      - "no records found"
      - "no matching records"
      - "no results found"
      - "no licensees found"

results:
  type: table
  table:
    # Match ONLY real data rows, NOT the header row. The results <tbody> holds a header
    # <tr> of <th> cells followed by data <tr data-toggle="modal" onclick="ShowLicenseeDetails(...)">
    # rows. A bare "…tbody tr" selector includes the header at index 0, but extraction drops
    # it (no <td>), so raw_rows and the click locator fell out of sync by one — the detail
    # loop clicked the header (no modal) and scraped the cookie banner instead. Scoping to
    # tr[data-toggle='modal'] keeps both in lockstep.
    row_selector: "#verifyresults table tbody tr[data-toggle='modal']"
    cell_selector: "td"
    skip_first_row: false
    columns:
      0: license_number
      1: status
      2: full_name
  # Clicking a data row fires ShowLicenseeDetails(licenseId) → AJAX fills the Bootstrap
  # modal .modal-body with the full record incl. Current Expiration Date (required output).
  has_detail_page: true
  detail_trigger:
    type: row_click
    # Same data-row selector as above so nth(idx) lines up with the extracted rows.
    selector: "#verifyresults table tbody tr[data-toggle='modal']"
    # Modal, not a page navigation: fire the row's onclick via JS (overlay-proof) and wait
    # for .modal-body — don't wait for a URL change that never happens.
    opens_modal: true
  pagination:
    enabled: false
    strategy: none

detail:
  scope_selector: ".modal-body"
  wait:
    strategy: element_visible
    # Bootstrap modal — AJAX fills .modal-body via ShowLicenseeDetails(licenseId).
    # Wait for .modal-body to contain a table or dl before extracting.
    selector: ".modal-body table tr, .modal-body dl dt, .modal-body .field-label"
    timeout_ms: 12000
    fallback_selectors:
      - ".modal-body"
      - ".modal.show .modal-body"
      - ".modal.in .modal-body"
  strategies:
    - type: two_column_table
    - type: four_column_table
    - type: dt_dd
    - type: label_sibling
    - type: field_label_value
  field_map:
    "License Number": license_number
    "License No": license_number
    "License #": license_number
    # NC PT modal shows the license under a bare "License" label.
    "License": license_number
    "Name": full_name
    "Full Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "Status": status
    "License Status": status
    "License Type": license_type
    "Profession": license_type
    "Designation": license_type
    "Expiration Date": expiration_date
    "Expiration": expiration_date
    "Exp Date": expiration_date
    "Expire Date": expiration_date
    "Renewal Date": expiration_date
    "License Expires": expiration_date
    "Expires": expiration_date
    # NC PT modal label for the expiry (strict output requirement).
    "Current Expiration Date": expiration_date
    "Issue Date": issue_date
    "Initial License Date": issue_date
    "Issued": issue_date
    # NC PT modal label for the initial-issue date.
    "Initial NC License Date": issue_date
    "Address": address
    "Work Address": address
    "City": city
    "State": state_code
  back_navigation:
    # Press Escape to close the modal before moving to the next row.
    strategy: escape_key
    wait_after_ms: 600

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  channel: "chrome"
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_PT/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
