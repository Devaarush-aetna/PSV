identity:
  source_id: WV_DENTAL
  board_name: West Virginia Board of Dental Examiners
  state: WV
  country: US
  profession_codes: [DDS, DMD, RDH, DA]
  # GLSuite ASP.NET WebForms portal at wvbodv7prod.glsuite.us.
  # Search fields: First Name, Last Name, Business Name, License Number, License Type (dropdown).
  # Results page: Licensee Name | Degree | Graduation Year | School | License Number |
  #   License Date | Specialty | Anesthesia | Expiration Date | Action Indicator | Order Verification.
  # No detail page — all data is in the flat results table.
  # No explicit Status column; expiration_date used to infer active/expired.
  # License numbers: numeric (e.g. 1918); "T" prefix = Teaching Permit; "V" prefix = Volunteer.
  base_url: "https://wvbodv7prod.glsuite.us/GLSuiteWeb/Clients/WVBOD/Public/Verification/Search.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#ContentPlaceHolder1_tbNumber"
      button_selector: "#ContentPlaceHolder1_btnSearch"
    - mode: last_name
      input_selector: "#ContentPlaceHolder1_tbLast"
      button_selector: "#ContentPlaceHolder1_btnSearch"
    - mode: first_name
      input_selector: "#ContentPlaceHolder1_tbFirst"
      button_selector: "#ContentPlaceHolder1_btnSearch"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#ContentPlaceHolder1_tbLast"
    search_button:
      selector: "#ContentPlaceHolder1_btnSearch"
  results_wait:
    strategy: network_idle
    timeout_ms: 20000
    # No results → page reloads to the search form ("Search Page" heading, no results table)
    no_results_indicators:
      - "no results"
      - "no matching"

results:
  type: table
  table:
    row_selector: "table tr"
    cell_selector: "td"
    skip_first_row: true
    columns:
      0: full_name
      1: license_type
      4: license_number
      5: issue_date
      8: expiration_date
      9: disciplinary_actions
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "active": active
    "Current": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/WV_DENTAL/{run_id}/"

compliance:
  tos_review_date: "2026-06-16"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
