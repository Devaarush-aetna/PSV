identity:
  source_id: "MA_MDDO"
  board_name: "Massachusetts Board of Registration in Medicine (MD/DO/AP)"
  state: "MA"
  country: "US"
  profession_codes: ["MD", "DO", "AP"]
  base_url: "https://findmydoctor.mass.gov/"
  archetype: json_api

search:
  modes:
    - mode: license_number
    - mode: last_name
    - mode: first_name
  results_wait:
    strategy: delay
    timeout_ms: 1000

# JSON API at api.medboard.mass.gov/api-public/search.
# Direct POST blocked by corporate proxy CORS; use intercept mode — the engine drives
# the public form and captures the SPA's own XHR response.
# Response shape: {results: {data: [...licenses]}}.
json_api:
  mode: intercept
  endpoint_url: "https://api.medboard.mass.gov/api-public/search"
  intercept_url_pattern: "/api-public/search"
  records_path: "results.data"
  # Default form layout = "By Name" with First/Last text inputs. License Number
  # mode requires clicking the "By License Number" radio first, which collapses
  # the form to a single license input.
  intercept_form:
    submit_via_enter: true
    fills:
      last_name:
        "input[type='text'] >> nth=1": "{q}"
      first_name:
        "input[type='text'] >> nth=0": "{q}"
      license_number:
        "input[type='text']": "{q}"
    pre_clicks:
      license_number:
        - "input[type='radio'][name='selected-search-type'] >> nth=0"
  timeout_ms: 30000

results:
  type: table
  has_detail_page: false

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map:
    "fullName": full_name
    "licenseNumber": license_number
    "licenseMetaName": license_type
    "profileStatus": status
    "originalDate": issue_date
    "expirationDate": expiration_date
    "businessAddress": address

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%Y-%m-%dT%H:%M:%S.%fZ"
    - "%Y-%m-%d"
    - "%m/%d/%Y"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: false
  capture_screenshot: false
  capture_on: ["error"]
  storage: local
  local_path: "Evidence/MA_MDDO/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
