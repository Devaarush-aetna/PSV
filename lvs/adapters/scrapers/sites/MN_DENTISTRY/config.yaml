identity:
  source_id: MN_DENTISTRY
  board_name: Minnesota Board of Dentistry
  state: MN
  country: US
  profession_codes: [DDS, DMD, RDH]
  base_url: "https://mnbodv7prod.glsuite.us/GLSuiteWeb/Clients/mnbod/Public/Licensee/LicenseeSearch.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#ContentPlaceHolder1_txtLicNumber"
    - mode: last_name
      input_selector: "#ContentPlaceHolder1_txtLastName"
    - mode: first_name
      input_selector: "#ContentPlaceHolder1_txtFirstName"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#ContentPlaceHolder1_txtLastName"
    search_button:
      selector: "input[value='Submit']"
  results_wait:
    strategy: network_idle
    timeout_ms: 20000
    no_results_indicators:
      - "no results"
      - "no records"
      - "not found"
      - "no match"

results:
  type: table
  table:
    # MN BOD uses table#DataTable (nested inner table); detail URLs encode all data in onclick
    row_selector: "#DataTable table tr"
    cell_selector: "td"
    skip_first_row: true
    # Columns: 0=Name, 1=City, 2=License Type, 3=License Number, 4=Status, 5=Detail btn (skip)
    columns:
      0: "full_name"
      1: "city"
      2: "license_type"
      3: "license_number"
      4: "status"
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: url_change
    timeout_ms: 15000
  strategies:
    - type: two_column_table
    - type: four_column_table
    - type: br_column_table
    - type: dt_dd
    - type: label_sibling
  field_map:
    "Name": full_name
    "Licensee Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "License Number": license_number
    "License No": license_number
    "License Type": license_type
    "Type": license_type
    "Status": status
    "License Status": status
    "Expiration Date": expiration_date
    "Expire Date": expiration_date
    "Issue Date": issue_date
    "Original Date": issue_date
    "City": city
    "State": state_code
    "Zip": zip_code
    "Disciplinary Action": disciplinary_action
  back_navigation:
    strategy: browser_back
    wait_after_ms: 1000

output:
  status_map:
    "Active": active
    "active": active
    "Current": active
    "current": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "navigation_error", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "Evidence/MN_DENTISTRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-11"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
