identity:
  source_id: AR_SWB
  board_name: Arkansas Social Work Licensing Board
  state: AR
  country: US
  profession_codes: [LCSW, LMSW, LSW, PLMSW, PLSW]
  # WordPress page on healthy.arkansas.gov; roster data maintained by Tyler Arkansas.
  # Single-field (last name) search; results rendered client-side via JS/Handlebars.
  # Result fields from template: firstname+middle+lastname, city, state, level
  #   (LCSW/LMSW/LSW/PLMSW/PLSW), number, dateissued, expdate, disc (disciplinary).
  # No explicit status column — active status is implied; disc field flags violations.
  # Row/cell selectors below are best-guess pending live DOM inspection (headless=false).
  base_url: "https://healthy.arkansas.gov/boards-commissions/boards/social-work-licensing-board/social-work-licensing-board-roster-search/"
  archetype: classic_html_form

search:
  modes:
    - mode: last_name
      input_selector: "input[placeholder='Last Name']"
      button_selector: "button[type='submit']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[placeholder='Last Name']"
    search_button:
      selector: "button[type='submit']"
  results_wait:
    strategy: ajax_row_count
    selector: ".result-item, .roster-result, table tbody tr"
    timeout_ms: 30000
    min_rows: 1
    stable_ticks: 2
    poll_interval_ms: 500
    no_results_indicators:
      - "no results found"
      - "no records found"
      - "no matching records"

results:
  type: table
  table:
    row_selector: ".result-item, .roster-result, table tbody tr"
    cell_selector: "td"
    skip_first_row: false
    # Column order is a best-guess from rendered template field order:
    # name | city | state | license_type | license_number | issue_date | expiration_date
    columns:
      0: full_name
      1: city
      2: state_code
      3: license_type
      4: license_number
      5: issue_date
      6: expiration_date
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "inactive": inactive
    "INACTIVE": inactive
    "Expired": expired
    "expired": expired
    "EXPIRED": expired
    "Suspended": suspended
    "suspended": suspended
    "SUSPENDED": suspended
    "Revoked": revoked
    "revoked": revoked
    "REVOKED": revoked
    "Probation": probation
    "probation": probation
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/AR_SWB/{run_id}/"

compliance:
  tos_review_date: "2026-08-06"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
  skip: true
  skip_reason: "selectors_unverified: row_selector and cell_selector are best-guess from static page analysis — JS-rendered results container not inspectable via static fetch. Run headless=false against base_url to confirm .result-item/.roster-result/tbody selectors before enabling."
