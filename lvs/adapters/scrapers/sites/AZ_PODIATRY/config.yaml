identity:
  source_id: "AZ_PODIATRY"
  board_name: "Arizona Board of Podiatry Examiners"
  state: "AZ"
  country: "US"
  profession_codes: ["DPM"]
  # Thentia Cloud portalus portal — same platform as AZ_ACUPUNCTURE / AZ_BEHAVIORAL_HEALTH.
  # Subdomain: azsbpe.portalus.thentiacloud.net/webs/portal/register/
  # Single keyword search (name or license number).
  # Requires proxy (PROXY=proxy:9119) — portalus subdomains block direct corporate egress.
  base_url: "https://azsbpe.portalus.thentiacloud.net/webs/portal/register/#"
  archetype: thentia_cloud

search:
  modes:
    - mode: license_number
      input_selector: "input#keywords"
    - mode: last_name
      input_selector: "input#keywords"
    - mode: first_name
      input_selector: "input#keywords"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input#keywords"
      fallback_selectors:
        - "input[name='keywords']"
        - "input[placeholder*='search' i]"
    search_button:
      selector: "button.btn-brand"
      fallback_selectors:
        - "[aria-label='Search']"
        - "button[type='submit']"
        - "a.btn-single"
  submit_via_enter: true
  results_wait:
    strategy: element_visible
    selector: "table tbody tr"
    timeout_ms: 60000
    no_results_indicators:
      - "showing results 1-0 of 0"
      - "no records found"
      - "no results were found"

results:
  type: table
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    # Columns confirmed from standalone AZ_PODIATRY scraper:
    # 0=License Number, 1=First Name, 2=Last Name, 3=License Type,
    # 4=License Status, 5=License Expiry Date, 6=Initial Registration Date
    columns:
      0: license_number
      1: first_name
      2: last_name
      3: license_type
      4: status
      5: expiration_date
      6: issue_date
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "License Number": license_number
    "Name": full_name
    "Status": status
    "License Type": license_type
    "Expiration Date": expiration_date

output:
  status_map:
    "Active": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Cancelled": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/AZ_PODIATRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-17"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
