identity:
  source_id: "NC_PODIATRY"
  board_name: "North Carolina Board of Podiatry Examiners"
  state: "NC"
  country: "US"
  profession_codes: ["DPM"]
  # iMIS ASP.NET portal at ncbpe.org. Form has 3 fields: Last Name, City, License Number.
  # Results rendered as <table class="result"> cards with h1 name, h2 org, and a <p> block
  # containing "License Number: N\nStatus: Active\nLicense issued on: ...\nRenewed until: ...".
  # custom_js extracts all fields directly from the card DOM without needing a detail page.
  base_url: "https://ncbpe.org/NCBPE/Search_Podiatrist/NCBPE/Content/Search_Podiatrist.aspx"
  archetype: state_portal

# 2026-06-15 (session 28 / iter 2): drop submit_via_enter — iMIS WebForms button
# fires __doPostBack via OnClick (Enter on input doesn't trigger postback). Use
# attribute-contains selectors that survive WebPartManager UUID drift. Tighten
# no-results indicators (the broad "no records"/"no results" matched body-text
# placeholders even on a successful search). Wait selector now narrows to the
# distinctive ", DPM" suffix only iMIS result cards have.
search:
  modes:
    - mode: license_number
      input_selector: "input[id*='Sheet0_Input2_TextBox'], input[id*='Input2_TextBox1']"
      button_selector: "input[id*='SubmitButton'], input[type='submit'][value*='Search']"
    - mode: last_name
      input_selector: "input[id*='Sheet0_Input0_TextBox'], input[id*='Input0_TextBox1']"
      button_selector: "input[id*='SubmitButton'], input[type='submit'][value*='Search']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[id*='Sheet0_Input0_TextBox']"
    search_button:
      selector: "input[id*='SubmitButton'], input[type='submit'][value*='Search']"
  results_wait:
    strategy: element_visible
    selector: "table.result"
    timeout_ms: 35000
    no_results_indicators:
      - "no podiatrists were found"
      - "no records to display"
      - "0 records found"

# Each licensee block is a <table class="result"> with:
#   <tr><td colspan="2"><h1>Name, DPM</h1><h2>Org Name</h2></td></tr>
#   <tr>
#     <td><p>City ST</p></td>
#     <td><p>License Number: N\nStatus: Active\nLicense issued on: M/D/YYYY\nRenewed until: M/D/YYYY</p></td>
#   </tr>
# custom_js parses all fields from the card DOM directly.
results:
  type: table
  table:
    row_selector: "table.result"
    cell_selector: "h1"
    skip_first_row: false
    columns:
      0: full_name
    custom_js: |
      () => {
        const cards = document.querySelectorAll('table.result');
        return Array.from(cards).map(card => {
          const h1 = card.querySelector('h1');
          const rows = card.querySelectorAll('tr');
          const infoTd = rows.length > 1 ? rows[1].querySelectorAll('td') : [];
          const infoText = infoTd.length > 1 ? (infoTd[1].innerText || '') : '';
          const addrText = infoTd.length > 0 ? (infoTd[0].innerText || '') : '';
          const licMatch = infoText.match(/License Number[:\s]+(\S+)/i);
          const statusMatch = infoText.match(/Status[:\s]+([^\n]+)/i);
          const issuedMatch = infoText.match(/License issued on[:\s]+([^\n]+)/i);
          const renewedMatch = infoText.match(/Renewed until[:\s]+([^\n]+)/i);
          return {
            full_name: h1 ? h1.innerText.replace(/,\s*DPM\s*$/i, '').trim() : '',
            license_number: licMatch ? licMatch[1].trim() : '',
            status: statusMatch ? statusMatch[1].trim() : '',
            issue_date: issuedMatch ? issuedMatch[1].trim() : '',
            expiration_date: renewedMatch ? renewedMatch[1].trim() : '',
            address: addrText.trim()
          };
        });
      }
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "License Number": license_number
    "License issued on": issue_date
    "Status": status
    "Renewed until": expiration_date
    "Expiration Date": expiration_date
    "Renewal Date": expiration_date
    "Name": full_name
    "Privileges": privileges
    "Disciplinary Action": disciplinary_actions

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%-m/%-d/%Y"
    - "%Y-%m-%d"
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  # ncbpe.org SSL certificate is expired — bypass TLS validation so Playwright can connect.
  ignore_https_errors: true

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_PODIATRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
  # 2026-06-15 (session 28): skip lifted. Using attribute-contains selectors that
  # survive iMIS WebPartManager UUID drift + submit_via_enter to bypass any
  # ScriptManager click handler. Result extraction uses vertical_kv on the iMIS
  # provider-card structure (label_selector="h2, h3, strong, b" with
  # record_marker_label="License Number"). Field IDs verified against
  # standalone scraper conventions; if smoke fails, headed-mode probe needed
  # to confirm exact iMIS attribute IDs and card heading structure.
