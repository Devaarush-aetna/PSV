identity:
  source_id: LA_MASSAGETHERAPY
  board_name: Louisiana Board of Massage Therapy
  state: LA
  country: US
  profession_codes: [MT]
  base_url: "https://www.labmt.org"
  archetype: pdf_bulk

# PDF roster scraper — downloads static licensee PDFs and searches in-memory.
# Two PDFs are published by the board at labmt.org (WordPress uploads):
#   estab — establishment registrations
#   prof  — individual massage therapist licenses
#
# URL pattern (date-stamped, update when board posts new files):
#   https://www.labmt.org/wp-content/uploads/YYYY/MM/estab-active-list-MM-DD-YYYY.pdf
#   https://www.labmt.org/wp-content/uploads/YYYY/MM/prof-active-MM-DD-YYYYb.pdf
#   (the "b" suffix on the prof PDF is a board convention for corrected versions)
#
# Known published date: 5-15-2026 (May 15, 2026)
# IMPORTANT: Update both URLs below when the board publishes a new roster.
pdf_bulk:
  pdfs:
    - url: "https://www.labmt.org/wp-content/uploads/2026/05/estab-active-list-5-15-2026.pdf"
      format: estab
      license_prefix: "E"
    - url: "https://www.labmt.org/wp-content/uploads/2026/05/prof-active-5-15-2026b.pdf"
      format: prof
      license_prefix: "L"
  cache_days: 7
  cache_dir: "./pdfs"

search:
  modes:
    - mode: license_number
    - mode: last_name
    - mode: first_name
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: ""
    search_button:
      selector: ""
  results_wait:
    strategy: delay
    timeout_ms: 1000
    no_results_indicators: []

results:
  type: table
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "License Number": license_number
    "First Name": first_name
    "Last Name": last_name
    "Medical": license_type
    "Status": status
    "Issued": issue_date
    "Expiration": expiration_date

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "./evidence/{source_id}/{run_id}/"

compliance:
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
  skip: true
  skip_reason: "pdf_urls_stale_portal_login_required: labmt.org WordPress PDF uploads for May 2026 return 404 (verified 2026-06-16). The replacement public-search at labmt.org/search/ is a WordPress site-search (not license lookup). The new portal at online.labmt.org requires login. Unblock: obtain new static PDF URLs from LABMT or add a classic_html_form config if the board builds a public name-search."
