identity:
  source_id: LA_MASSAGETHERAPY
  board_name: Louisiana Board of Massage Therapy
  state: LA
  country: US
  profession_codes: [MT]
  base_url: "https://www.labmt.org"
  archetype: pdf_bulk

# PDF roster scraper — downloads static licensee PDFs and searches in-memory.
# Two PDFs are published by the board at labmt.org (WordPress uploads):
#   estab — establishment registrations
#   prof  — individual massage therapist licenses
#
# URL discovery: PDFs are linked from labmt.org/search/ as anchors with text
# "PROFESSIONAL LICENSE SEARCH" (prof) and "ESTABLISHMENT LICENSE SEARCH" (estab).
# Board publishes new PDFs roughly weekly; URLs change with the file date.
# Strategy `page_link` discovers fresh URLs at runtime so the config doesn't go stale.
# Most recent verified URL pattern (2026-06-16):
#   https://www.labmt.org/wp-content/uploads/YYYY/MM/Active-LMT-M-DD-YYYY.pdf
#   https://www.labmt.org/wp-content/uploads/YYYY/MM/M-DD-YYYYEstablishments.pdf
pdf_bulk:
  download_strategy: page_link
  base_url: "https://www.labmt.org/search/"
  pdfs:
    - link_selector: "a:has-text('PROFESSIONAL LICENSE SEARCH')"
      format: prof
      license_prefix: "L"
    - link_selector: "a:has-text('ESTABLISHMENT LICENSE SEARCH')"
      format: estab
      license_prefix: "E"
  cache_days: 7
  cache_dir: "./PSV/PDFS/LA_MASSAGETHERAPY"

search:
  modes:
    - mode: license_number
    - mode: last_name
    - mode: first_name
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: ""
    search_button:
      selector: ""
  results_wait:
    strategy: delay
    timeout_ms: 1000
    no_results_indicators: []

results:
  type: table
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "License Number": license_number
    "First Name": first_name
    "Last Name": last_name
    "Medical": license_type
    "Status": status
    "Issued": issue_date
    "Expiration": expiration_date

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/LA_MASSAGETHERAPY/{run_id}/"

compliance:
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
