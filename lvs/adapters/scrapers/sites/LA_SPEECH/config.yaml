identity:
  source_id: LA_SPEECH
  board_name: Louisiana Board of Examiners for Speech-Language Pathology and Audiology
  state: LA
  country: US
  profession_codes: [SLP, AUD]
  # ColdFusion index.cfm portal at lbespa.org.
  # From Louisiana_SpeechLangPathologyAudiology_SpeechPathologistAudiologist_Scraper.py:
  #   GET search params: n=name (combined), l=license, p=profession code
  #   Profession codes: 1=Audiology, 2=Audiology+HA Dispensing, 6=Provisional SLP,
  #                     7=Provisional SLP Assistant, 11=SLP Assistant, 12=Speech-Language Pathology
  #   Form input: input[name="n"] = name search, input[name="l"] = license number
  #   Results: <li class="row"> cards; name in <h3>, fields in <span> key:value pairs.
  # NOTE: Engine extracts name only (h3 within li.row). License/status in span key-value pairs
  #       require cfm_li_row engine enhancement for full extraction.
  base_url: "https://www.lbespa.org/index.cfm/licensee-search"
  archetype: classic_html_form

search:
  pre_search_click: "a#btn-refine-search"
  # 2026-06-15 (session 28): same accordion pattern as LA_DIETETICS — Bootstrap
  # collapse panels grouped by profession code (1=Audiology, 2=Aud+HA, 6=Prov SLP,
  # 7=Prov SLP Asst, 11=SLP Asst, 12=SLP). post_search_click_all expands every
  # accordion so the per-panel AJAX loads all li.row entries.
  post_search_click_all: ".panel-heading a, [data-toggle='collapse'], a[data-target*='#panel'], a[href^='#panel']"
  modes:
    - mode: license_number
      input_selector: "input[name='l']"
    - mode: last_name
      input_selector: "input[name='n']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[name='n']"
    search_button:
      selector: "a#btn-licensee-search"
  results_wait:
    strategy: network_idle
    timeout_ms: 35000
    no_results_indicators:
      - "no results"
      - "no records"
      - "not found"
      - "no match"

results:
  type: table
  table:
    row_selector: "li.row"
    cell_selector: "h3"
    skip_first_row: false
    columns:
      0: "full_name"
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 2000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/LA_SPEECH/{run_id}/"

compliance:
  tos_review_date: "2026-06-12"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
  # 2026-06-15 (session 28): skip lifted. Engine gap (accordion-expand) closed by
  # post_search_click_all in navigator.py + 35s timeout for slow corporate-proxy
  # response. If smoke fails on lbespa.org reachability, the unblock is network
  # access — not engine code.
