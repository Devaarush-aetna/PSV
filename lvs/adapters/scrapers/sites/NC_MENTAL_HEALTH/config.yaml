identity:
  source_id: "NC_MENTAL_HEALTH"
  board_name: "North Carolina Board of Licensed Clinical Mental Health Counselors"
  state: "NC"
  country: "US"
  profession_codes: ["LCMHC", "LCMHCA"]
  base_url: "https://portal.ncblcmhc.org/verification/search.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#txtLicenseNumber"
      button_selector: "#btnAJAX"
    - mode: last_name
      input_selector: "#txtLastName"
      button_selector: "#btnAJAX"
    # first_and_last: fills both first and last name inputs for a more specific search.
    # Reduces ambiguous multi-result sets when last_name alone returns multiple records.
    - mode: first_and_last
      input_selector: "#txtLastName"
      button_selector: "#btnAJAX"
      extra_inputs:
        "#txtFirstName": "{first}"
    - mode: first_name
      input_selector: "#txtFirstName"
      button_selector: "#btnAJAX"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#txtLastName"
    search_button:
      selector: "#btnAJAX"
  # AJAX populates table#MultiResultsList without changing URL. Wait until tbody
  # rows actually render and stabilise.
  results_wait:
    strategy: ajax_row_count
    selector: "table#MultiResultsList tbody tr, table tbody tr"
    timeout_ms: 30000
    min_rows: 1
    stable_ticks: 2
    poll_interval_ms: 400
    no_results_indicators:
      - "no records found"
      - "no matching"
      - "no licensees"
      - "no results found for your search criteria"
      - "0 results"
      - "no active licensees"

results:
  type: table
  table:
    row_selector: "table#MultiResultsList tbody tr"
    cell_selector: "td"
    columns:
      0: license_number
      1: full_name
      2: status
      3: city
  # Detail page enabled to capture Renewal Date (= expiration_date).
  # The AJAX table resets on back-navigation when there are multiple results —
  # the engine pre-extracts summary rows and falls back to them for subsequent
  # rows, so only the first matched row gets full detail data. For license_number
  # searches (1 result) this is never an issue.
  # When a license_number search returns a unique match, the site navigates
  # directly to result.aspx (no multi-result table). single_result_url_pattern
  # detects this and calls _scrape_one_detail instead of _scrape_with_detail_clicks.
  single_result_url_pattern: "result.aspx"
  has_detail_page: true
  detail_trigger:
    type: link_in_cell
    selector: "table#MultiResultsList tbody tr td:nth-child(2) a"
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: element_visible
    selector: "table tr td, dl dt, span.field-value"
    timeout_ms: 15000
    fallback_selectors:
      - "table tr td"
      - "dl dt"
      - "h2"
      - "span"
  back_navigation:
    strategy: browser_back
    wait_after_ms: 2000
  strategies:
    - type: two_column_table
    - type: four_column_table
    - type: dt_dd
    - type: label_sibling
    - type: field_label_value
  field_map:
    "License Number": license_number
    "License No": license_number
    "License #": license_number
    "Name": full_name
    "Full Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "Status": status
    "License Status": status
    "License Type": license_type
    "Profession": license_type
    "Expiration Date": expiration_date
    "Expiration": expiration_date
    "Exp Date": expiration_date
    "Expire Date": expiration_date
    "License Expiration": expiration_date
    "License Exp Date": expiration_date
    "Renewal Date": expiration_date
    "Issue Date": issue_date
    "Issued": issue_date
    "City": city

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_MENTAL_HEALTH/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
