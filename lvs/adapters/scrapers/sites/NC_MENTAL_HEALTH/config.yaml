identity:
  source_id: "NC_MENTAL_HEALTH"
  board_name: "North Carolina Board of Licensed Clinical Mental Health Counselors"
  state: "NC"
  country: "US"
  profession_codes: ["LCMHC", "LCMHCA"]
  base_url: "https://portal.ncblcmhc.org/verification/search.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#txtLicenseNumber"
      button_selector: "#btnAJAX"
    - mode: last_name
      input_selector: "#txtLastName"
      button_selector: "#btnAJAX"
    - mode: first_name
      input_selector: "#txtFirstName"
      button_selector: "#btnAJAX"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#txtLastName"
    search_button:
      selector: "#btnAJAX"
  # AJAX populates table#MultiResultsList without changing URL. Wait until tbody
  # rows actually render and stabilise.
  results_wait:
    strategy: ajax_row_count
    selector: "table#MultiResultsList tbody tr"
    timeout_ms: 25000
    min_rows: 1
    stable_ticks: 2
    poll_interval_ms: 400
    no_results_indicators:
      - "no records found"
      - "no matching"
      - "no licensees"

results:
  type: table
  table:
    row_selector: "table#MultiResultsList tbody tr"
    cell_selector: "td"
    columns:
      0: license_number
      1: full_name
      2: status
      3: city
  has_detail_page: false

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_MENTAL_HEALTH/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
