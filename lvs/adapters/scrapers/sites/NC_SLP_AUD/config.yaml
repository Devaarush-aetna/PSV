identity:
  source_id: "NC_SLP_AUD"
  board_name: "North Carolina Board of Examiners for Speech-Language Pathologists and Audiologists"
  state: "NC"
  country: "US"
  profession_codes: ["SLP","AUD"]
  base_url: "https://portal.ncboeslpa.org/Verification/search.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#txtLicNum"
      button_selector: "#btnSubmit"
    - mode: last_name
      input_selector: "#txtLast"
      button_selector: "#btnSubmit"
    - mode: first_name
      input_selector: "#txtFirst"
      button_selector: "#btnSubmit"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#txtLast"
    search_button:
      selector: "#btnSubmit"
  results_wait:
    strategy: network_idle
    selector: "table tr"
    timeout_ms: 25000
    no_results_indicators: []  # avoid substring false-positives ("0 Records Found" in "90 Records Found")

results:
  type: table
  table:
    row_selector: "table.table-hover tbody tr"
    cell_selector: "td"
    columns:
      0: license_type
      1: full_name
      2: city
      3: license_number
      4: status
  has_detail_page: true
  detail_trigger:
    # Expiration date is only on the detail page — click the name cell link (col 1).
    type: link_in_cell
    selector: "table.table-hover tbody tr td:nth-child(2) a"
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: element_visible
    selector: "table tr td, dl dt, h2, .panel-body"
    timeout_ms: 15000
    fallback_selectors:
      - "table tr td"
      - "dl dt"
      - "h2"
  strategies:
    - type: th_td_table
    - type: two_column_table
    - type: four_column_table
    - type: dt_dd
    - type: label_sibling
    - type: field_label_value
  field_map:
    "License Number": license_number
    "License No": license_number
    "License #": license_number
    "Name": full_name
    "Full Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "Status": status
    "License Status": status
    "License Type": license_type
    "Profession": license_type
    "Expiration Date": expiration_date
    "Expiration": expiration_date
    "Exp Date": expiration_date
    "Expire Date": expiration_date
    "License Expiration": expiration_date
    "License Exp Date": expiration_date
    "Renewal Date": expiration_date
    "License Renewal Date": expiration_date
    "Renews": expiration_date
    "Expires": expiration_date
    "Expiry Date": expiration_date
    "Expiry": expiration_date
    "License Expiry": expiration_date
    "License Expiry Date": expiration_date
    "Issue Date": issue_date
    "Issued": issue_date
    "City": city
  back_navigation:
    strategy: browser_back
    wait_after_ms: 2000

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Deceased": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "Evidence/NC_SLP_AUD/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
