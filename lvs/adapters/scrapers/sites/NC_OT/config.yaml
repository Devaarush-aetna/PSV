identity:
  source_id: "NC_OT"
  board_name: "North Carolina Board of Occupational Therapy"
  state: "NC"
  country: "US"
  profession_codes: ["OTR","COTA"]
  base_url: "https://ncbot-online.org/ot_verification_new.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#ctl00_MainContentPlaceHolder_LicenseRadTextBox"
      button_selector: "#ctl00_MainContentPlaceHolder_SearchButton"
    - mode: last_name
      input_selector: "#ctl00_MainContentPlaceHolder_LastRadTextBox"
      button_selector: "#ctl00_MainContentPlaceHolder_SearchButton"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#ctl00_MainContentPlaceHolder_LastRadTextBox"
    search_button:
      selector: "#ctl00_MainContentPlaceHolder_SearchButton"
  results_wait:
    strategy: network_idle
    selector: "table tr"
    timeout_ms: 25000
    no_results_indicators:
      - "no records found"
      - "no matching"
      - "no results"
      - "no licensees"
      - "0 records"

results:
  type: table
  table:
    row_selector: "#ctl00_MainContentPlaceHolder_LicenseRadGrid table tbody tr"
    cell_selector: "td"
    skip_first_row: false
    # Verified columns (live site): Last Name | First Name | License | Designation | License Issued | Expiration Date | Standing
    columns:
      0: last_name
      1: first_name
      2: license_number
      3: license_type
      4: issue_date
      5: expiration_date
      6: status
  has_detail_page: false
  pagination:
    enabled: true
    strategy: next_button
    next_selector: "a.rgPageNext"

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "License Number": license_number
    "License": license_number
    "Name": full_name
    "First Name": first_name
    "Last Name": last_name
    "Status": status
    "Standing": status
    "License Type": license_type
    "Designation": license_type
    "License Issued": issue_date
    "Expiration Date": expiration_date
    "Expiration": expiration_date

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Good standing": active
    "Good Standing": active
    "Operating": active
    "OPERATING": active
    "operating": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Deceased": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport: {width: 1280, height: 900}
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/NC_OT/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
