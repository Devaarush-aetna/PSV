identity:
  source_id: AL_OPTOMETRY
  board_name: Alabama Board of Optometry
  state: AL
  country: US
  profession_codes: [OD]
  # ASP.NET GET form at optometry.alabama.gov. Submit navigates to Search1.aspx.
  # Inputs: name=LastName, name=License, submit name=Search.
  # Results: #GridView1 — columns: 0=ID 1=LASTNAME 2=FIRSTNAME 3=CITY 4=STATE 5=LICENSE 6=detail.
  # Pagination: ASP.NET GridView pager row embedded in table (last row); disabled here.
  base_url: "http://www.optometry.alabama.gov/Search.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: last_name
      input_selector: "input[name='LastName']"
    - mode: license_number
      input_selector: "input[name='License']"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[name='LastName']"
    search_button:
      selector: "input[name='Search'], input[type='submit']"
  results_wait:
    strategy: element_visible
    selector: "#GridView1 tr"
    timeout_ms: 20000
    no_results_indicators:
      - "no records"
      - "no results"
      - "no matching"
      - "0 results"

results:
  type: table
  table:
    row_selector: "#GridView1 tr"
    cell_selector: "xpath=./td"
    skip_first_row: true
    columns:
      1: last_name
      2: first_name
      3: city
      4: state_code
      5: license_number
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Retired": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/AL_OPTOMETRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-17"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
  skip: false
