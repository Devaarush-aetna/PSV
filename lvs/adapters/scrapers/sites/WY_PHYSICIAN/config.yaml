identity:
  source_id: WY_PHYSICIAN
  board_name: Wyoming Board of Medicine — Physician
  state: WY
  country: US
  profession_codes: [MD, DO]
  base_url: "https://wybomv7prod.glsuite.us/GLSuiteWeb/Clients/WYBOM/Public/LicenseeSearch.aspx?SearchType=Physician"
  archetype: classic_html_form
  # NOTE: TL-prefix licenses (e.g. TL8870) are Wyoming Telemedicine Registrations — a separate
  # license class issued by the same board.  They appear on a different GLSuite search page
  # (SearchType=Telemedicine or a dedicated LicenseeSearchTM.aspx).  Searching here with a
  # TL license number will not find them.  Create a separate WY_TELEHEALTH board config once
  # the correct GLSuite SearchType parameter is confirmed.

search:
  modes:
    - mode: license_number
      input_selector: "#ContentPlaceHolder1_txtLicNum"
    - mode: last_name
      input_selector: "#ContentPlaceHolder1_txtLastName"
    - mode: first_name
      input_selector: "#ContentPlaceHolder1_txtFirstName"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#ContentPlaceHolder1_txtLastName"
    search_button:
      selector: "#ContentPlaceHolder1_btnSubmit"
  results_wait:
    strategy: network_idle
    timeout_ms: 20000
    no_results_indicators:
      - "no results"
      - "no records"
      - "not found"
      - "no match"

results:
  type: table
  table:
    row_selector: "#ContentPlaceHolder1_dtgResults tr"
    cell_selector: "td"
    skip_first_row: true
    # Col 6 format: "Expires MM/DD/YYYY; Active" — expiry and status are both parsed via custom_js
    custom_js: |
      () => {
        const rows = [...document.querySelectorAll('#ContentPlaceHolder1_dtgResults tr')];
        const records = [];
        for (const row of rows.slice(1)) {
          const cells = [...row.querySelectorAll('td')];
          if (cells.length < 7) continue;
          const statusRaw = cells[6].textContent.trim();
          const expMatch = statusRaw.match(/Expires?\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);
          const statusPart = statusRaw.includes(';') ? statusRaw.split(';').pop().trim() : statusRaw;
          records.push({
            full_name: cells[0] ? cells[0].textContent.trim() : '',
            address: cells[1] ? cells[1].textContent.trim() : '',
            license_number: cells[3] ? cells[3].textContent.trim() : '',
            issue_date: cells[4] ? cells[4].textContent.trim() : '',
            expiration_date: expMatch ? expMatch[1] : '',
            status: statusPart,
            license_type: cells[8] ? cells[8].textContent.trim() : '',
            disciplinary_action: cells[10] ? cells[10].textContent.trim() : '',
          });
        }
        return records;
      }
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map: {}

output:
  status_map:
    "Active": active
    "active": active
    "Current": active
    "current": active
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
    "Retired": inactive
    "Cancelled": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "navigation_error", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

  proxy:
    enabled: false   # proxy:9119 returns 403 (Azure AG WAF block) — direct Chromium works
evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "Evidence/WY_PHYSICIAN/{run_id}/"

compliance:
  tos_review_date: "2026-06-11"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
