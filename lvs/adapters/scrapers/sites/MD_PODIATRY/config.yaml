identity:
  source_id: MD_PODIATRY
  board_name: Maryland Board of Podiatric Medical Examiners
  state: MD
  country: US
  profession_codes: [DPM]
  # Roster is an Excel file linked from the Aetna Maryland source page.
  # Link text "Maryland Podiatry Roster" on the page downloads md_dp.xlsx.
  # XLSX row 0 = title line; row 1 = column headers; row 2+ = data.
  # Columns (after strip): License Num, Last Name, First Name/ M.I., Address 1,
  #   Address 2, City, ST, Zip, Status, Issue Date, Expiration Date, Discipl Comments
  # Status codes: A=Active, N=Not Renewed/Inactive.
  # Cache 30 days — roster is updated monthly.
  base_url: "https://aetnet.aetna.com/provider_services/cvo/geddi/state_pages/maryland.htm"
  archetype: csv_bulk

csv_bulk:
  download_strategy: link_text_xlsx
  link_text: "Maryland Podiatry Roster"
  xlsx_header_row: 1
  header_row: 0
  cache_days: 30
  cache_dir: "./PSV/CSVS"
  encoding: "utf-8-sig"
  search_columns:
    license_number: "License Num"
    last_name: "Last Name"
    first_name: "First Name/ M.I."

search:
  modes:
    - mode: license_number
    - mode: last_name
    - mode: first_name
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: ""
    search_button:
      selector: ""
  results_wait:
    strategy: network_idle
    timeout_ms: 30000
    no_results_indicators: []

results:
  type: table
  table:
    row_selector: ""
    cell_selector: ""
    columns: {}
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 500
  strategies: []
  field_map:
    "License Num": license_number
    "Last Name": last_name
    "First Name/ M.I.": first_name
    "ST": state_code
    "Status": status
    "Issue Date": issue_date
    "Expiration Date": expiration_date
    "Discipl Comments": disciplinary_action

output:
  status_map:
    "A": active
    "Active": active
    "active": active
    "N": expired
    "Inactive": inactive
    "inactive": inactive
    "Expired": expired
    "expired": expired
    "Suspended": suspended
    "Revoked": revoked
  date_formats:
    - "%Y-%m-%d %H:%M:%S"
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1000
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: false
  capture_screenshot: false
  capture_on: []
  storage: local
  local_path: "Evidence/MD_PODIATRY/{run_id}/"

compliance:
  tos_review_date: "2026-07-13"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: license_number
  query: "01557"
  expect:
    min_records: 1
    full_name_contains: "ABAWI"
