identity:
  source_id: "AZ_OPTOMETRY"
  board_name: "Arizona State Board of Optometry"
  state: "AZ"
  country: "US"
  profession_codes: ["OD"]
  # OnGovCore platform: https://azus-sboe.ongovcore.com/public/verify-professional-license
  # Search URL (with query): /verify-professional-license/results?search_query={query}
  # Profile URL: /verify-professional-license/{license_number}?search_query={query}&tab=licenses
  # Single-input keyword search (matches across name + license).
  base_url: "https://azus-sboe.ongovcore.com/public/verify-professional-license"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "input#keywords"
    - mode: last_name
      input_selector: "input#keywords"
    - mode: first_name
      input_selector: "input#keywords"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "input[name='search_query']"
      fallback_selectors:
        - "input[type='search']"
        - "input[placeholder*='Search' i]"
        - "input[type='text']"
    search_button:
      selector: "button[type='submit']"
      fallback_selectors:
        - "input[type='submit']"
        - "[aria-label='Search']"
  submit_via_enter: true
  results_wait:
    strategy: network_idle
    selector: "table tbody tr"
    timeout_ms: 30000
    no_results_indicators:
      - "no results found"
      - "no matching"
      - "0 professionals matching"

results:
  type: table
  table:
    row_selector: "table tbody tr"
    cell_selector: "td"
    columns:
      0: full_name
      1: license_number
      3: license_type
      4: status
      5: expiration_date
      6: state_code
  has_detail_page: false
  pagination:
    enabled: false
    strategy: none

detail:
  wait:
    strategy: delay
    timeout_ms: 1000
  strategies: []
  field_map:
    "License Number": license_number
    "Name": full_name
    "Status": status
    "License Status": status
    "License Type": license_type
    "Issue Date": issue_date
    "Expiration Date": expiration_date

output:
  status_map:
    "Active": active
    "active": active
    "Inactive": inactive
    "Expired": expired
    "Suspended": suspended
    "Revoked": revoked
    "Closed": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 2
    backoff_ms: [2000, 5000]
    retry_on: ["timeout", "network_error"]
  proxy:
    enabled: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "error"]
  storage: local
  local_path: "Evidence/AZ_OPTOMETRY/{run_id}/"

compliance:
  tos_review_date: "2026-06-15"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
