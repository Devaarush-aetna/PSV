identity:
  source_id: MD_PT
  board_name: Maryland Board of Physical Therapy Examiners
  state: MD
  country: US
  profession_codes: [PT, PTA]
  # ASP.NET WebForms portal at mdbnc.health.maryland.gov/bptverification/ — identical structure to MD_CHIROPRACTIC.
  # License search: #MainContent_tbLookupLic  + #MainContent_btnLookup
  # Name search:    #MainContent_tbLookupName + #MainContent_btnLookup
  # Results: first <tbody> table — 4 columns: License# | Name | Status | View Details link
  # Detail: element_ids matching MD_CHIROPRACTIC exactly (#MainContent_lbName, etc.)
  base_url: "https://mdbnc.health.maryland.gov/bptverification/default.aspx"
  archetype: classic_html_form

search:
  modes:
    - mode: license_number
      input_selector: "#MainContent_tbLookupLic"
      button_selector: "#MainContent_btnLookup"
    - mode: last_name
      input_selector: "#MainContent_tbLookupName"
      button_selector: "#MainContent_btnLookup"
  form:
    search_by_dropdown:
      strategy: none
    search_input:
      selector: "#MainContent_tbLookupName"
    search_button:
      selector: "#MainContent_btnLookup"
  results_wait:
    strategy: element_visible
    selector: "a:has-text('View Details')"
    timeout_ms: 20000
    no_results_indicators:
      - "no records found"
      - "no match"
      - "not found"
      - "0 records"

results:
  type: table
  table:
    row_selector: "tbody tr"
    cell_selector: "td"
    skip_first_row: false
    columns:
      0: license_number
      1: full_name
      2: status
  has_detail_page: true
  detail_trigger:
    type: link_in_cell
    selector: "a:has-text('View Details')"
  pagination:
    enabled: true
    strategy: next_button
    next_selector: "a#MainContent_btnNext"
    disabled_class: "aspNetDisabled"

detail:
  wait:
    strategy: element_visible
    selector: "#MainContent_lbName"
    timeout_ms: 15000
    fallback_selectors:
      - "#MainContent_lbLicNum"
      - "#MainContent_lbStatus"
  strategies:
    - type: element_ids
      id_map:
        MainContent_lbName: "Name"
        MainContent_lbLicNum: "License Number"
        MainContent_lbStatus: "License Status"
        MainContent_lbLicType: "License Type"
        MainContent_lbOrgLicDate: "Issue Date"
        MainContent_lbExpDate: "Expiration Date"
        MainContent_lbDisAction: "Disciplinary Action"
  field_map:
    "Name": full_name
    "License Number": license_number
    "License Status": status
    "License Type": license_type
    "Issue Date": issue_date
    "Expiration Date": expiration_date
  back_navigation:
    strategy: browser_back
    wait_after_ms: 1500

output:
  status_map:
    "Active": active
    "active": active
    "ACTIVE": active
    "Inactive": inactive
    "inactive": inactive
    "INACTIVE": inactive
    "Expired": expired
    "expired": expired
    "EXPIRED": expired
    "Non-renewed": expired
    "Non Renewed": expired
    "Suspended": suspended
    "suspended": suspended
    "Revoked": revoked
    "revoked": revoked
    "Cancelled": inactive
    "Retired": inactive
  date_formats:
    - "%m/%d/%Y"
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%B %d, %Y"
    - "%b %d, %Y"

transport:
  browser: chromium
  headless: true
  viewport:
    width: 1280
    height: 900
  timeout_ms: 60000
  navigation_timeout_ms: 30000
  rate_limit:
    delay_between_requests_ms: 1500
    max_concurrent: 1
  retry:
    max_attempts: 3
    backoff_ms: [1000, 2000, 4000]
    retry_on: ["timeout", "network_error"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

evidence:
  capture_html: true
  capture_screenshot: true
  capture_on: ["search_results", "detail_page", "error"]
  storage: local
  local_path: "./evidence/{source_id}/{run_id}/"

compliance:
  tos_review_date: "2026-06-10"
  requires_captcha: false
  requires_login: false
  robots_txt_compliant: true

smoke_test:
  mode: last_name
  query: "Smith"
  expect:
    min_records: 1
    full_name_contains: "Smith"
